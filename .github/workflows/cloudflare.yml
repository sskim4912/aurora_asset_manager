# 화면 파일이 바뀌면 Cloudflare Workers에 자동 배포 (데이터·사진 저장 때는 실행 안 됨)
name: Cloudflare 배포
on:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.json', 'icon-*.png', 'wrangler.jsonc', '.assetsignore', '.github/workflows/cloudflare.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
