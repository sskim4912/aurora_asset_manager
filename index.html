<!--
  Aurora Asset Manager (개발 단계)
  ─────────────────────────────────
  · 이 파일 하나에 화면과 기능이 모두 들어 있어요.
  · 자산 데이터·사진은 Worker 서버를 통해 GCP 비공개 버킷에 저장돼요.
  · 코드 구성
      [1] 기본 설정 (CONFIG)      ← 비밀번호, 카카오 키, 저장소 이름 등 바꿀 값은 여기
      [2] 데이터 저장소 (Store)   ← GCP 저장 API 연결
      [3] 로그인
      [4] 화면: 현황 / 자산 / 지도 / 라벨
      [5] 자산 상세·등록 패널
      [6] 엑셀 (양식·올리기·내보내기)
      [7] 설정 · 시작
-->
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--line:#e6e9f0;--line2:#d5dae4;--text:#141a2a;--sub:#667085;--muted:#98a2b3;
  --acc:#0a5eb0;--acc-d:#084b8d;--acc-bg:#e8f1fb;
  --ok:#15803d;--ok-bg:#dcfce7;--use:#0369a1;--use-bg:#e0f2fe;--chk:#b45309;--chk-bg:#fef3c7;--off:#667085;--off-bg:#eef0f3;
  --red:#dc2626;--red-bg:#fee2e2;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.upq-pill{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:9999;background:#1e3a8a;color:#fff;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap}.upq-pill.bad{background:#b91c1c}.upq-pill button{margin-left:8px;background:#fff;color:#b91c1c;border:0;border-radius:999px;padding:3px 10px;font-weight:700}
.hdr-scan{flex:none;padding:6px 8px;gap:4px;font-size:12px}.hdr-scan svg{width:17px;height:17px}.map-card-close{display:block;margin:0 0 5px auto;border:0;background:#f1f5f9;color:#475569;border-radius:5px;padding:4px 7px;font-size:12px;cursor:pointer}
.hdr-install{padding:6px 11px;font-size:12.5px;background:#eef2ff;border-color:#c7d2fe;color:#312e81;flex:none}@media(max-width:400px){.hdr-install{padding:6px 8px;font-size:12px}}
.ins-steps{margin:4px 0 0;padding-left:20px;line-height:1.9;font-size:15px}.ins-arrow{text-align:center;font-size:34px;animation:insb 1s infinite}@keyframes insb{50%{transform:translateY(8px)}}
.install-box{margin-top:16px;padding:12px;border-radius:12px;background:#eef2ff;color:#312e81;font-size:13.5px;line-height:1.55;text-align:center}.install-box .btn{width:100%;margin-top:8px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:-.01em}
.muted{color:var(--muted)}
.sub{color:var(--sub);font-size:13.5px;margin:4px 0 0}
svg.i{flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 로그인 */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#eef2f7}
.gate-card{background:#fff;border-radius:20px;padding:36px 30px 28px;width:100%;max-width:370px;box-shadow:0 12px 40px rgba(16,24,40,.12);border:1px solid var(--line)}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#4338ca,#0e7490);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.gate-card h1{font-size:21px;margin:18px 0 2px;letter-spacing:-.02em}
.gate-card form{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.pw{width:100%;font-size:22px;letter-spacing:.3em;text-align:center;padding:14px;border:1.5px solid var(--line2);border-radius:12px;outline:none}
.pw:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-bg)}
.gate-err{color:var(--red);font-size:13px;min-height:18px;text-align:center}
.remember{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);justify-content:center}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 레이아웃 */
#app{min-height:100vh}
.hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--line);padding:0 24px;height:64px;box-shadow:0 1px 0 rgba(16,24,40,.02)}
.hdr-logo{display:flex;align-items:center;padding-right:16px;border-right:1px solid var(--line);height:34px}
.gs-logo{height:30px;width:auto;display:block}
.hdr-title{display:flex;flex-direction:column;line-height:1.2;margin-right:14px}
.hdr-title b{font-size:15.5px;letter-spacing:-.01em;color:#2b2f36}
.hdr-title small{font-size:12px;color:var(--sub)}
.hdr-nav{display:flex;gap:4px;height:100%}
.hdr-nav .nav-btn{width:auto;border-radius:0;height:100%;padding:0 14px;border-bottom:3px solid transparent;font-size:15px}
.hdr-nav .nav-btn.on{background:none;color:var(--acc);border-bottom-color:var(--acc)}
.hdr-nav .nav-btn .cnt{margin-left:6px;background:var(--acc)}
.hdr .sync{width:auto}
.mobile-only{display:none!important}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px 14px}
.brand{display:flex;gap:11px;align-items:center;padding:2px 8px 24px}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand small{color:var(--sub);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:11px 12px;border-radius:10px;color:#4b5565;font-weight:600;font-size:14.5px;text-align:left}
.nav-btn:hover{background:#f5f6fa}
.nav-btn.on{background:var(--acc-bg);color:var(--acc)}
.nav-btn .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.side-foot .nav-btn{font-size:13.5px;padding:9px 12px}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);padding:9px 12px;border-radius:10px;border:0;background:none;text-align:left;width:100%}
.sync:hover{background:#f5f6fa}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:#22c55e}.dot.local{background:#f59e0b}.dot.err{background:#ef4444}
.dot.saving,.dot.loading{background:#6366f1;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
main{padding:22px 28px 56px;min-width:0;max-width:1400px;width:100%;margin:0 auto}
.topbar,.tabbar{display:none}

/* 공통 요소 */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:25px;margin:0;letter-spacing:-.025em}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-group{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:#fff;padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{background:#f7f8fb}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc-d)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:13px 18px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:none;padding:8px;border-radius:9px;color:var(--sub);display:inline-grid;place-items:center}
.icon-btn:hover{background:#f1f3f7}
.link{border:0;background:none;color:var(--acc);font-weight:600;font-size:13px;padding:0}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px 3px 8px;border-radius:99px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{--c:var(--ok);--cb:var(--ok-bg)}.mid{--c:var(--chk);--cb:var(--chk-bg)}.bad{--c:var(--red);--cb:var(--red-bg)}.use{--c:var(--use);--cb:var(--use-bg)}.off{--c:var(--off);--cb:var(--off-bg)}
.badge.ok,.badge.mid,.badge.bad,.badge.use,.badge.off{color:var(--c);background:var(--cb)}
.due{font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap;display:inline-block}
.due.red{color:var(--red);background:var(--red-bg)}.due.amber{color:var(--chk);background:var(--chk-bg)}.due.gray{color:var(--sub);background:#f1f3f6}
.empty{text-align:center;padding:34px 10px;color:var(--sub)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:0 12px;color:var(--muted);min-width:0}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-bg)}
.search input{border:0;outline:none;padding:10px 0;flex:1;min-width:0;background:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:#fff;padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;color:#4b5565}
.chip.on{background:var(--text);border-color:var(--text);color:#fff}
.sel{border:1px solid var(--line2);border-radius:10px;padding:9px 10px;background:#fff}

/* 현황 */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.stat{cursor:pointer}
.stat.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-bg)}
.stat.alert{--c:var(--red)} .stat.gray{--c:#8a94a6} .stat.teal{--c:#0e8a80}
.audit-card{--c:var(--acc);cursor:default}
.audit-card.on-audit{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-bg)}
.audit-card.due{--c:var(--chk);background:#fffbeb;border-color:#f5d48a}
.audit-card .progress{margin:6px 0 4px}
.card-links{display:flex;gap:12px;align-items:center;margin-top:4px}
.card-link{border:0;background:none;padding:0;font-size:12.5px;font-weight:700;color:var(--acc);cursor:pointer}
.card-link.strong{margin-left:auto;color:#fff;background:var(--acc);border-radius:7px;padding:3px 10px}
.card-link.warn{color:var(--chk);margin-top:6px;display:block}
.card-link.on{text-decoration:underline}
.stat-sub{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}.stat-badge{margin-top:auto;padding-top:8px;min-height:34px;display:flex;align-items:flex-end}
.stat .progress{margin:7px 0 4px}
.coord-link{display:inline-block;padding:3px 9px;border-radius:7px;background:#fff4e5;color:#b45309;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}.coord-link:hover,.coord-link.on{background:#b45309;color:#fff}
.st-link{border-radius:6px;padding:1px 4px;margin:0 -2px;cursor:pointer}
.st-link:hover,.st-link.on{background:var(--acc-bg);color:var(--acc)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-radius:var(--r);padding:14px 18px;margin-bottom:14px}
.banner.audit-on{background:#fff;border:1.5px solid var(--acc)}
.banner.audit-due{background:var(--chk-bg);color:var(--chk);border:1px solid #f5d48a}
.banner.audit-due b{color:#7c3a06}
.audit-line{font-size:12.5px;color:var(--sub);margin:-4px 0 14px 2px}
.list-head{display:flex;gap:10px;align-items:center;margin:2px 2px 10px;font-size:13px;color:var(--sub);font-weight:600}
.list-head .chip{padding:3px 10px;font-size:12px;cursor:pointer}
.sel-bar{position:sticky;top:72px;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#1b2433;color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:10px;box-shadow:0 6px 20px rgba(16,24,40,.18)}
.sel-bar .btn{background:#2b3648;border-color:#3b475b;color:#fff}.sel-bar .btn:hover{background:#364258}
.sel-bar .muted{color:#9aa6ba;margin-left:6px}.sel-bar .link{color:#9cc4ff}
.vsep{width:1px;height:20px;background:#3b475b;margin:0 4px}
.tbl th.ck,.tbl td.ck{width:38px;padding-right:0}
.tbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);cursor:pointer}
.tbl th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
.tbl th.sortable:hover{color:var(--text)}
.tbl th.sortable.on{color:var(--acc)}
.tbl th .arrow{font-size:10px;margin-left:4px;opacity:.5}
.tbl th.on .arrow{opacity:1}
.tbl tr.picked{background:var(--acc-bg)}
.no-coord{color:#e8a23a;font-size:9px;vertical-align:middle}
.dd{position:relative}
.dd-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.14);padding:6px;min-width:200px;z-index:30}
.dd-menu.open{display:block}
.dd-menu button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;text-align:left}
.dd-menu button:hover{background:#f3f5f9}
.map-box{height:calc(100vh - 360px);min-height:420px}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:35;border:0;border-radius:99px;background:var(--acc);color:#fff;font-weight:800;font-size:15px;padding:14px 20px 14px 16px;box-shadow:0 8px 24px rgba(10,94,176,.4);align-items:center;gap:8px}
.fab svg{width:22px;height:22px}
.scanner{position:fixed;inset:0;z-index:80;background:#000;color:#fff;display:flex;flex-direction:column}
.scan-top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top))}
.scan-view{position:relative;flex:1;min-height:0;overflow:hidden}
.scan-view video{width:100%;height:100%;object-fit:cover}
.scan-frame{position:absolute;left:50%;top:50%;width:62vw;height:62vw;max-width:300px;max-height:300px;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.scan-panel{background:#fff;color:var(--text);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:58vh;overflow:auto}
.scan-msg{font-weight:700;text-align:center;margin-bottom:6px}

.scan-res{border-radius:12px;padding:12px 14px;margin-bottom:10px}
.scan-res.ok{background:var(--ok-bg)}.scan-res.bad{background:var(--red-bg);color:var(--red)}
.scan-res-top{display:flex;justify-content:space-between;align-items:center}
.scan-name{font-size:17px;font-weight:800;margin:4px 0 2px}
.scan-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.scan-tags span{background:#fff;border-radius:7px;padding:3px 8px;font-size:12px;font-weight:700;color:var(--ok)}
.scan-tags span.warn{color:var(--chk)}
.scan-done{background:var(--acc);color:#fff;border-radius:12px;padding:12px;text-align:center;font-weight:800;margin-bottom:10px}
.shutter-row{display:flex;justify-content:space-between;align-items:center;margin:14px 4px 4px}
.shutter{width:72px;height:72px;border-radius:50%;border:5px solid var(--acc);background:#fff;box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 40px var(--acc-bg)}
.shutter:active{transform:scale(.94)}
.scanner.photo-mode .scan-frame,.scanner.no-frame .scan-frame{display:none}
.scan-frame{border:0;box-shadow:none;background:linear-gradient(#fff,#fff) 0 0/34px 4px,linear-gradient(#fff,#fff) 0 0/4px 34px,linear-gradient(#fff,#fff) 100% 0/34px 4px,linear-gradient(#fff,#fff) 100% 0/4px 34px,linear-gradient(#fff,#fff) 0 100%/34px 4px,linear-gradient(#fff,#fff) 0 100%/4px 34px,linear-gradient(#fff,#fff) 100% 100%/34px 4px,linear-gradient(#fff,#fff) 100% 100%/4px 34px;background-repeat:no-repeat;opacity:.85}
.scan-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scan-btns .btn:only-child{grid-column:1/-1}
.scan-sub-btns{text-align:center;margin-top:10px}
.scan-note{font-size:11.5px;color:var(--sub);text-align:center;margin:8px 0 0}
.scan-prog{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:13px}
.scan-left{font-size:12px;color:var(--sub)}
.asset-photo{cursor:zoom-in;position:relative;border-radius:12px;overflow:hidden;margin-bottom:14px;background:#eef1f5;aspect-ratio:4/3}
.asset-photo img{width:100%;height:100%;object-fit:cover;display:block}
.asset-photo span{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;border-radius:6px;padding:2px 7px}
.asset-photo.err img{display:none}.asset-photo.err::after{content:"사진을 불러오는 중이거나 없어요";position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:13px}
.photo-pick{width:100%;background:#fff;display:flex;justify-content:center;align-items:center;gap:6px;margin-top:10px;border:1px dashed var(--line2);border-radius:10px;padding:10px;font-weight:700;font-size:13.5px;color:var(--acc);cursor:pointer}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:#eef1f5;display:block}
.thumb.empty{display:block}
.pcount{position:absolute;right:-4px;bottom:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#1e3a8a;color:#fff;font-size:10.5px;font-weight:700;line-height:17px;text-align:center;border:1.5px solid #fff}
.photo-tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.photo-tools .del{color:#b91c1c}
.dl-pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:9999;background:#111827;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600}
.thumb-btn{position:relative;border:0;background:none;padding:0;border-radius:8px;cursor:pointer;display:block}
.thumb-btn.add{width:40px;height:40px;border:1.5px dashed var(--line2);color:var(--muted);display:grid;place-items:center;background:#fafbfc}
.thumb-btn.add:hover{border-color:var(--acc);color:var(--acc)}
.mc-photo{position:absolute;right:14px;bottom:14px}
.mc-photo .thumb,.mc-photo .thumb-btn.add{width:52px;height:52px}

.coord-history{display:block!important}.coord-history small{display:block;font-size:11px;color:var(--sub);overflow-wrap:anywhere}.coord-history .link{display:block;margin-top:5px}
@media(max-width:640px){.mapcard{max-width:240px;min-width:190px}.spot-list{max-height:180px}.mapcard.map-sheet{position:absolute;bottom:12px;left:8px;right:8px;max-width:none;min-width:0;transform:none;z-index:30;max-height:65%;overflow:auto}.mapcard.map-sheet::after{display:none}.map-name{max-width:175px;font-size:11px}}

.map-location-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 9px;font-size:12px;color:var(--sub)}
.distance-badge{background:#fff;color:#075cb4;border:1px solid #b8cce7;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 2px 7px #0004;pointer-events:none;max-width:240px;white-space:normal;text-align:center}
.asset-distance{font-size:12px;color:#075cb4;margin-top:9px;line-height:1.5}.my-position-dot{width:18px;height:18px;border-radius:50%;background:#1677ff;border:3px solid #fff;box-shadow:0 1px 5px #0004}

/* 라벨 */
.lab-layout{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.lab-pick{padding:14px;position:sticky;top:20px}
.lab-row{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 6px;font-size:13px;color:var(--sub)}
.lab-row div{display:flex;gap:12px}
.lab-items{max-height:calc(100vh - 260px);overflow:auto;margin:0 -6px}
.lab-it{display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:9px;cursor:pointer}
.lab-it:hover{background:#f7f8fb}
.lab-it input{width:17px;height:17px;accent-color:var(--acc);flex:none}
.lab-preview{min-width:0}
.sheet-scale{transform-origin:top left}
.sheet-gap{height:16px}
.prev-note{font-size:12.5px;color:var(--sub);margin:0 0 10px}
.lab-sheets{background:#eef1f5;border-radius:12px;padding:14px;max-height:62vh;overflow:auto}

/* 라벨 실물 크기 (인쇄·미리보기 공통) */
.sheet{background:#fff;display:grid;grid-auto-rows:70mm;align-content:center;justify-content:center;box-shadow:0 2px 14px rgba(16,24,40,.12);overflow:hidden}
.paper-seg{display:inline-grid;grid-template-columns:1fr 1fr;background:#eef0f3;border-radius:11px;padding:3px;gap:3px}
.paper-seg button{border:0;background:none;border-radius:8px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--sub);display:inline-flex;align-items:center;gap:5px}
.paper-seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.paper-seg small{font-weight:500;margin-left:4px}
.dues{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.label{width:70mm;height:70mm;border:.3mm dashed #9aa3b2;display:flex;flex-direction:column;align-items:center;padding:3.5mm 4mm 3mm;color:#111;font-family:inherit}
.lb-top{width:100%;display:flex;justify-content:space-between;font-size:7.5pt;font-weight:700;color:#4338ca;letter-spacing:.04em}
.lb-top span:last-child{color:#555;letter-spacing:0}
.lb-qr{width:40mm;height:40mm;margin-top:1.8mm;image-rendering:pixelated}
.lb-qr.none{display:grid;place-items:center;border:1px solid #ccc;font-size:8pt;color:#999}
.lb-id{font-size:16pt;font-weight:800;letter-spacing:.02em;margin-top:1.6mm;line-height:1}
.lb-name{font-size:8pt;font-weight:600;text-align:center;line-height:1.25;margin-top:1.3mm;max-height:2.5em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;width:100%}
#print-area{display:none}

/* 토스트 */
#toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#111827;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s ease-out;max-width:90vw}
.toast.err{background:#b91c1c}.toast.warn{background:#92400e}
@keyframes tin{from{transform:translateY(10px);opacity:0}}

/* 휴대폰 */
@media (max-width:899px){
  .hdr{padding:0 10px 0 14px;height:56px;gap:8px;padding-top:env(safe-area-inset-top);height:calc(56px + env(safe-area-inset-top))}
  .hdr-logo{border-right:0;padding-right:4px}
  .gs-logo{height:24px}
  .hdr-title small,.hdr-nav,.sync-text{display:none}
  .hdr-title b{font-size:14px}
  .hdr .sync{padding:6px 8px}
  main{padding:14px 12px 40px}
  h1{font-size:22px}
  .page-head{align-items:center;margin-bottom:14px}
  .desktop-only{display:none!important}
  .mobile-only{display:inline-flex!important}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
  .stats>.stat:last-child{grid-column:1/-1}
  .stat{padding:11px 12px 10px}
  .stat .num{font-size:24px;margin-top:2px}
  .stat-sub{font-size:11.5px;white-space:normal;line-height:1.4}
  .stat-badge{min-height:0;padding-top:7px}
  .lease-link,.trash-link,.coord-link{font-size:11.5px;padding:3px 7px;white-space:normal}
  .banner{padding:12px 14px}
  .banner .ri-main{flex-basis:100%;min-width:0}
  .banner .btn{flex:1}
  .hdr-title{min-width:0;margin-right:0}
  .hdr-title b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
  .toolbar>.btn.primary{flex:1}
  .toolbar{gap:8px}
  .toolbar .search{max-width:none;flex-basis:100%}
  .toolbar .sel{flex:1 1 40%;min-width:0}
  .toolbar .sp{display:none}
  .tbl-wrap{display:none}
  .mlist{display:block}
  .panel{width:100%}
  .map-box{height:calc(100vh - 330px);min-height:360px}
  .modal-wrap{padding:0;align-items:flex-end}
  .modal{border-radius:18px 18px 0 0;max-height:94vh}
  .set-grid{grid-template-columns:1fr}
  #toasts{bottom:24px}
}
@media print{
  body{background:#fff}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  .sheet{box-shadow:none;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

  <div class="scan-panel" id="scan-panel"></div>
</div>

/* ── 할 일: 상태 '하' + 점검일 7일 이내 + 렌탈 반납 14일 이내 ── */
function todos() {
  const out = []; const miss = missingIds();
  activeAssets().forEach(a => {
    const tags = [];
    if (a.status === '하') tags.push({ level: 'red', text: '상태 하', rank: -1000 });
    const c = dday(a.nextCheck);
    if (c !== null && c <= 7) tags.push({ level: c < 0 ? 'red' : 'amber', text: '점검 ' + ddText(c), rank: c });
    const r = dday(a.rentalDue);
    if (r !== null && r <= 14) tags.push({ level: r < 0 ? 'red' : 'amber', text: '임대 반납 ' + ddText(r), rank: r });
    if (miss.has(a.id)) tags.push({ level: 'red', text: '실사 미발견', rank: -900 });
    if (tags.length) out.push({ a, tags: tags.sort((x, y) => x.rank - y.rank) });
  });
  return out;
}

function filteredAssets() {
  const q = UI.q.trim().toLowerCase(), f = UI.filter;
  const todo = f === 'todo' ? new Set(todos().map(t => t.a.id)) : null;
  return DOC.assets.filter(a => {
    if (f === 'lease') { if (!isLease(a)) return false; }
    else if (f === 'leaseOut') { if (!isLease(a) || !a.out) return false; }
    else if (f === 'out') { if (!a.out || isGone(a)) return false; }
    else if (f === 'disposed') { if (!isGone(a)) return false; }
    else {
      if (a.out) return false;
      if (f === 'todo' && !todo.has(a.id)) return false;
      if (f === 'nocoord' && hasCoord(a)) return false;
      if (f === 'unaudited' && (!DOC.audit || DOC.audit.checked[a.id])) return false;
      if (f.startsWith('st:') && a.status !== f.slice(3)) return false;
    }
    return (UI.cat === '전체' || a.category === UI.cat) && (UI.item === '전체' || a.item === UI.item) && (UI.loc === '전체' || a.location === UI.loc) &&
      (!q || [a.id, a.item, a.model, a.contract, a.location, a.category, a.note, a.manager, a.leaseVendor, a.out && a.out.type, a.out && a.out.to, a.out && a.out.docNo].some(v => String(v || '').toLowerCase().includes(q)));

}
function schedOf(a) {
  if (a.out) return { d: dday(a.out.date) ?? 0, t: (a.out.date || '') + ' 종료', lvl: 'gray' };
  const items = [];
  const c = dday(a.nextCheck); if (c !== null) items.push({ d: c, t: '점검 ' + ddText(c), lvl: c < 0 ? 'red' : c <= 7 ? 'amber' : 'gray' });

  return items.sort((x, y) => x.d - y.d)[0] || null;
}

  await saveChange(doc => { const now = new Date().toISOString(); ids.forEach(id => { const x = doc.assets.find(y => y.id === id); if (x && !x.out) { addLog(x, `상태 ${x.status} → ${s}`, now); x.status = s; x.updatedAt = now; } }); },

/* ── 지도 (자산 화면의 [지도] 전환: 걸러진 자산만 표시) ── */
let KAKAO_P = null, MAP = null, MAP_INFO = null, MAP_FOCUS = null;
function loadKakao() {
  if (window.kakao && kakao.maps && kakao.maps.LatLng) return Promise.resolve();
  if (KAKAO_P) return KAKAO_P;
  KAKAO_P = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey=' + CONFIG.KAKAO_KEY;
    const to = setTimeout(() => rej(new Error('timeout')), 10000);
    s.onload = () => { try { kakao.maps.load(() => { clearTimeout(to); res(); }); } catch (e) { clearTimeout(to); rej(e); } };
    s.onerror = () => { clearTimeout(to); rej(new Error('load')); };
    document.head.appendChild(s);
  });
  KAKAO_P.catch(() => { KAKAO_P = null; });
  return KAKAO_P;
}
let GM_P = null, HtmlOv = null;
function loadGoogle() {
  if (window.google && google.maps && google.maps.Map) { if (!HtmlOv) mkHtmlOv(); return Promise.resolve(); }
  if (GM_P) return GM_P;
  GM_P = new Promise((res, rej) => {
    const to = setTimeout(() => rej(new Error('timeout')), 12000);
    window.__gmReady = () => { clearTimeout(to); mkHtmlOv(); res(); };
    window.gm_authFailure = () => toast('구글 지도 키가 맞지 않거나, 이 주소에서 쓸 수 없게 막혀 있어요', 'err');
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(CONFIG.GOOGLE_MAPS_KEY)}&v=weekly&language=ko&region=US&loading=async&callback=__gmReady`;
    s.async = true; s.onerror = () => { clearTimeout(to); rej(new Error('load')); };
    document.head.appendChild(s);
  });
  GM_P.catch(() => { GM_P = null; });
  return GM_P;
}
function mkHtmlOv() {   // 구글 지도 위에 HTML(핀·정보창)을 그리는 틀
  HtmlOv = class extends google.maps.OverlayView {
    constructor(pos, el, ya, z, pane) { super(); this.pos = pos; this.el = el; this.ya = ya; this.z = z; this.pane = pane; }
    onAdd() { const e = this.el; e.style.position = 'absolute'; e.style.zIndex = this.z; this.getPanes()[this.pane].appendChild(e); google.maps.OverlayView.preventMapHitsAndGesturesFrom(e); }
    draw() { const pt = this.getProjection().fromLatLngToDivPixel(this.pos); if (!pt) return; Object.assign(this.el.style, { left: pt.x + 'px', top: pt.y + 'px', transform: `translate(-50%,${-this.ya * 100}%)` }); }
    onRemove() { this.el.remove(); }
    setPosition(p) { this.pos = p; if (this.getProjection()) this.draw(); }
  };
}
/* 지도 엔진 하나로 쓰기: 구글 키가 있으면 구글(위성), 없으면 카카오(위성). 확대 정도는 카카오 '레벨'(작을수록 확대)로 통일 */
const MAPX = {

  load() { return this.g() ? loadGoogle() : loadKakao(); },
  ll(lat, lng) { return this.g() ? new google.maps.LatLng(+lat, +lng) : new kakao.maps.LatLng(+lat, +lng); },
  create(el, c, lv) {
    if (this.g()) {
      const m = new google.maps.Map(el, { center: { lat: +c[0], lng: +c[1] }, zoom: 21 - lv, mapTypeId: 'satellite', gestureHandling: 'greedy', clickableIcons: false,
        mapTypeControl: true, mapTypeControlOptions: { position: google.maps.ControlPosition.TOP_LEFT, style: google.maps.MapTypeControlStyle.HORIZONTAL_BAR, mapTypeIds: ['satellite', 'roadmap'] },
        streetViewControl: false, fullscreenControl: false, rotateControl: false, zoomControl: true });
      const h = new google.maps.OverlayView(); h.onAdd = () => {}; h.draw = () => {}; h.onRemove = () => {}; h.setMap(m); m.__proj = h;   // 화면 좌표 계산용
      return m;
    }
    const m = new kakao.maps.Map(el, { center: new kakao.maps.LatLng(+c[0], +c[1]), level: lv });
    m.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
    m.addControl(new kakao.maps.MapTypeControl(), kakao.maps.ControlPosition.TOPLEFT);
    m.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
    return m;

  level(m) { return this.g() ? 21 - m.getZoom() : m.getLevel(); },
  setLevel(m, lv, anchor) { if (this.g()) { m.setZoom(21 - lv); if (anchor) m.panTo(anchor); } else m.setLevel(lv, anchor ? { anchor } : undefined); },
  px(m, p) {
    if (this.g()) { const pr = m.__proj && m.__proj.getProjection(); if (!pr) return null; const pt = pr.fromLatLngToContainerPixel(this.ll(p.lat, p.lng)); return pt && { x: pt.x, y: pt.y }; }
    const pr = m.getProjection && m.getProjection(); if (!pr) return null; const pt = pr.containerPointFromCoords(this.ll(p.lat, p.lng)); return { x: pt.x, y: pt.y };
  },
  overlay(m, pos, el, ya, z, top) {   // HTML 올리기 → { remove(), move(pos) }
    if (this.g()) { const o = new HtmlOv(pos, el, ya, z, top ? 'floatPane' : 'overlayMouseTarget'); o.setMap(m); return { remove: () => o.setMap(null), move: p => o.setPosition(p) }; }
    const o = new kakao.maps.CustomOverlay({ position: pos, content: el, xAnchor: .5, yAnchor: ya, zIndex: z }); o.setMap(m);
    return { remove: () => o.setMap(null), move: p => o.setPosition(p) };

    : (p.type === 'update' ? p.changes.map(c => `<div class="chg">${FIELD_KO[c.k] || c.k}: ${esc(c.from === '' || c.from == null ? '(빈칸)' : c.from)} → <b>${esc(c.to)}</b></div>`).join('')
    : p.type === 'new' ? `<span class="chg">${esc(p.f.category || '')} · ${p.f.qty} ${p.f.unit} · ${esc(p.f.location || '')} · ${p.f.out ? esc(p.f.out.type) : '상태 ' + esc(p.f.status)}</span>` : '<span class="muted">바뀐 내용 없음</span>')
    + (p.notes.length ? `<div class="hint" style="margin:3px 0 0">${p.notes.map(esc).join(' · ')}</div>` : '');
  openModal(`
    <div class="m-head"><h2>엑셀 반영 미리보기</h2><button class="icon-btn" onclick="closeModal()">${icon('x', 20)}</button></div>
    <div class="m-body">
      <p class="sub" style="margin:0 0 8px">${esc(fname)} · ${PLAN.length}줄</p>
      <div class="sum-chips"><span class="t-new">신규 ${n('new')}</span><span class="t-update">변경 ${n('update')}</span><span class="t-error">오류 ${n('error')}</span><span class="t-same">그대로 ${n('same')}</span></div>
      ${PLAN.length ? `<table class="plan"><thead><tr><th>줄</th><th>구분</th><th>관리번호</th><th>품목</th><th>내용</th></tr></thead><tbody>
        ${PLAN.map(p => `<tr><td>${p.line}</td><td><span class="tag t-${p.type}">${TYPE_KO[p.type]}</span></td><td class="mono">${p.id ? esc(p.id) : '<span class="muted">자동</span>'}</td><td>${esc(p.name)}</td><td>${detail(p)}</td></tr>`).join('')}
      </tbody></table>` : `<div class="empty"><b>읽을 내용이 없어요</b>첫 줄이 '관리번호(ID), 보유부서, … 중분류 …' 제목인지 확인해 주세요</div>`}
      ${n('error') ? `<p class="hint">오류가 있는 줄은 빼고 반영돼요. 엑셀을 고쳐서 다시 올리면 돼요.</p>` : ''}
    </div>
    <div class="m-foot"><span class="sp"></span><button class="btn" onclick="closeModal()">취소</button>
      <button class="btn primary" id="plan-go" ${ok ? '' : 'disabled'} onclick="applyPlan()">${ok}건 반영하기</button></div>`, 'wide');
}
async function applyPlan() {
  const items = PLAN.filter(p => p.type === 'new' || p.type === 'update'); if (!items.length) return;
  $('plan-go').disabled = true; $('plan-go').textContent = '반영 중…';
  const nNew = items.filter(p => p.type === 'new').length, nUp = items.length - nNew;
  const res = await saveChange(doc => {
    const now = new Date().toISOString(); let added = 0, updated = 0, skipped = 0;
    const base = new Set(CATEGORIES.flatMap(k => BASE_CATALOG[k]));
    items.forEach(p => {
      if (p.f.item && !base.has(p.f.item)) doc.catalog[p.f.item] = p.f.category;
      if (p.type === 'new') {
        const id = p.id || nextId(doc);
        if (doc.assets.some(x => x.id === id)) { skipped++; return; }
        doc.assets.push({ id, category: '', item: '', model: '', contract: '', acq: '', qty: 1, unit: 'EA', location: '', locInit: p.f.locInit || p.f.location || '', manager: '',
          status: '상', lat: '', lng: '', nextCheck: '', rentalDue: '', leaseVendor: '', leaseStart: '', leaseTel: '', leaseContact: '', note: '', out: null, ...p.f, log: [{ at: now, t: '엑셀로 등록' }], updatedAt: now }); added++;
      } else { const a = doc.assets.find(x => x.id === p.id); if (a) { p.changes.forEach(c => a[c.k] = p.f[c.k]); addLog(a, '엑셀 수정: ' + p.changes.map(c => FIELD_KO[c.k] || c.k).join(', '), now); a.updatedAt = now; updated++; } }
      if (p.f.location && !doc.locations.includes(p.f.location)) doc.locations.push(p.f.location);
    });
    return { added, updated, skipped };
  }, `엑셀 반영: 신규 ${nNew}건 · 변경 ${nUp}건`);
  if (res) { closeModal(); toast(`신규 ${res.added}건 · 변경 ${res.updated}건을 반영했어요${res.skipped ? ` (이미 있는 번호 ${res.skipped}건 건너뜀)` : ''}`); }
  else if ($('plan-go')) { $('plan-go').disabled = false; $('plan-go').textContent = `${items.length}건 반영하기`; }
}

/* ═══════════════════════════════════════════
   [7] 설정 · 시작
   ═══════════════════════════════════════════ */
function openSettings() {
  const c = Store.cfg();
  const locCount = l => DOC.assets.filter(a => a.location === l).length;
  openModal(`
    <div class="m-head"><h2>설정</h2><button class="icon-btn" onclick="closeModal()">${icon('x', 20)}</button></div>
    <div class="m-body">
      <div class="set-block">
        <h3>클라우드 저장소</h3>
        <p class="hint">모든 기기가 같은 자산·사진을 사용해요. 로그인하면 자동으로 연결됩니다.</p>
        <div id="s-test" class="test-res"></div>
      </div>
      <div class="set-block">
        <h3>품목 추가</h3>
        <p class="hint" style="margin:2px 0 10px">새 품목은 모든 기기에 바로 적용돼요. 분류(대분류)는 6개 중에서 골라요.</p>
        <div class="coord-row"><input class="inp" id="s-item" placeholder="예: 정수기"><select class="inp" id="s-item-cat">${CATEGORIES.map(k => `<option>${esc(k)}</option>`).join('')}</select></div>
        <button class="btn" style="margin-top:8px;width:100%" onclick="addItem()">${icon('plus', 16)} 품목 추가</button>
        ${Object.keys(DOC.catalog || {}).length ? `<p class="hint">추가한 품목: ${Object.entries(DOC.catalog).map(([it, k]) => `${esc(it)} (${esc(k)})`).join(', ')}</p>` : ''}
      </div>
      <div class="set-block">
        <h3>위치 관리</h3>
        <p class="hint" style="margin:2px 0 10px">이름을 바꾸면 그 위치의 자산이 한꺼번에 바뀌어요. 이름 규칙: <b>건물 · 층 · 실</b> (예: 본관 2층 회의실)</p>
        <div class="loc-list">${DOC.locations.map((l, i) => `<div><span>${esc(l)} <span class="muted">${locCount(l)}건</span></span><span><button class="link" onclick="renameLoc(${i})">이름 바꾸기</button>${locCount(l) ? '' : ` · <button class="link" style="color:var(--red)" onclick="removeLoc(${i})">삭제</button>`}</span></div>`).join('')}</div>
        <button class="btn" style="margin-top:8px;width:100%" onclick="addLoc()">${icon('plus', 16)} 위치 추가</button>
      </div>
      <details class="set-block adv"><summary>고급 설정 (평소에는 바꾸지 마세요)</summary>
        <label class="set-one">라벨 QR 주소<input class="inp" id="s-qr" value="${esc(c.qrBase)}" placeholder="${esc(CONFIG.QR_BASE_DEFAULT)}"></label>
        <div class="set-grid" style="margin-top:10px">
          <label>보유부서 코드 (내보내기용)<input class="inp" id="s-dept" value="${esc(c.deptCode || '')}" placeholder="비워도 돼요"></label>
          <label>보유부서명<input class="inp" id="s-dept-name" value="${esc(c.deptName || 'Aurora Project(충남)')}"></label>
        </div>
        <p class="hint">보유부서는 엑셀 내보내기 파일에만 들어가요. 이 기기에만 저장되고 공개 데이터에는 들어가지 않아요.</p>
      </details>
    </div>
    <div class="m-foot"><button class="btn" onclick="testConn()">연결 확인</button><span class="sp"></span>
      <button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveSettings()">저장</button></div>`);
}
async function addLoc() {
  const name = (prompt('새 위치 이름 (건물 · 층 · 실 순서)\n예: 본관 2층 회의실, 식당동, 야적장 A구역') || '').trim().replace(/\s+/g, ' ');
  if (!name) return; if (DOC.locations.includes(name)) return toast('이미 있는 위치예요', 'warn');
  if (await saveChange(doc => { doc.locations.push(name); return true; }, `위치 추가: ${name}`, `'${name}' 위치를 추가했어요`)) openSettings();
}
async function renameLoc(i) {
  const old = DOC.locations[i]; const name = (prompt(`'${old}'의 새 이름`, old) || '').trim().replace(/\s+/g, ' ');
  if (!name || name === old) return;
  const n = DOC.assets.filter(a => a.location === old).length;
  if (!confirm(`'${old}' → '${name}'\n이 위치의 자산 ${n}건이 함께 바뀌어요.`)) return;
  if (await saveChange(doc => { const now = new Date().toISOString(); doc.locations = doc.locations.filter(l => l !== old && l !== name).concat(name);
      doc.assets.forEach(a => { if (a.location === old) { addLog(a, `위치 이름 변경 ${old} → ${name}`, now); a.location = name; a.updatedAt = now; } }); return true; },
    `위치 이름 변경: ${old} → ${name} (${n}건)`, `위치 이름을 바꿨어요 (${n}건)`)) { if (UI.loc === old) UI.loc = name; openSettings(); }
}
async function removeLoc(i) {
  const l = DOC.locations[i]; if (DOC.assets.some(a => a.location === l)) return toast('자산이 있는 위치는 지울 수 없어요', 'warn');
  if (await saveChange(doc => { doc.locations = doc.locations.filter(x => x !== l); return true; }, `위치 삭제: ${l}`, '위치를 지웠어요')) openSettings();
}
function readSettingsForm() {
  return { qrBase: $('s-qr').value.trim(), deptCode: $('s-dept').value.trim(), deptName: $('s-dept-name').value.trim() };
}
async function testConn() {
  const out = $('s-test'); out.style.color = 'var(--sub)'; out.textContent = '확인 중…';
  try { await apiRequest('/api/status'); out.style.color = 'var(--ok)'; out.textContent = '✓ 클라우드 저장소에 연결됐어요'; }
  catch (error) { out.style.color = 'var(--red)'; out.textContent = error.message; }
}
async function addItem() {
  const it = $('s-item').value.trim(), k = $('s-item-cat').value;
  if (!it) return toast('품목 이름을 넣어 주세요', 'warn');
  if (catOf(it)) return toast(`'${it}'은(는) 이미 '${catOf(it)}'에 있어요`, 'warn');
  const res = await saveChange(doc => { doc.catalog[it] = k; return true; }, `품목 추가: ${it} (${k})`, `'${it}' 품목을 추가했어요`);
  if (res) openSettings();
}
function saveSettings() {
  const c = readSettingsForm();
  Store.saveCfg(c); Object.keys(QR_CACHE).forEach(k => delete QR_CACHE[k]);
  closeModal(); toast('설정을 저장했어요');
  reloadData();
}
function startApp() {
  $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
  document.querySelectorAll('[data-ic]').forEach(el => el.outerHTML = icon(el.dataset.ic));
  DOC = normalizeDoc(lsGet('aam_gcs_cache') || seedDoc());
  render(); reloadData();
  if (OPEN_SET) { OPEN_SET = false; setTimeout(openSettings, 400); }
}
window.addEventListener('hashchange', () => { render(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('modal').classList.contains('hidden')) closeModal(); else closeDrawer(); } });
let RESIZE_T; window.addEventListener('resize', () => { clearTimeout(RESIZE_T); RESIZE_T = setTimeout(() => { if ($('lab-sheets')) renderPrint(); if (MAP) { MAPX.relayout(MAP); drawPins(); } }, 150); });

/* 휴대폰 앱 설치 안내 (카카오톡으로 받은 링크 → 외부 브라우저 → 설치) */
let INSTALL_EVT = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL_EVT = e; showInstall(); });
window.addEventListener('appinstalled', () => { $('install-box').classList.add('hidden'); $('hdr-install').classList.add('hidden'); toast('바탕화면에 비품관리 앱이 설치됐어요'); });
const FIRST_URL = location.href; // QR(?id=) 주소도 그대로 넘김
function openExternal() { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(FIRST_URL); }
async function doInstall() { if (!INSTALL_EVT) return; INSTALL_EVT.prompt(); await INSTALL_EVT.userChoice; INSTALL_EVT = null; showInstall(); }
const UA = navigator.userAgent, IS_AND = /Android/i.test(UA), IN_KAKAO = /KAKAOTALK/i.test(UA);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function installApp() {
  if (INSTALL_EVT) return doInstall();
  if (IN_KAKAO) return openExternal();
  const head = '<div class="m-head"><h2>📲 홈 화면에 추가</h2><button class="icon-btn" onclick="closeModal()">✕</button></div><div style="padding:4px 20px 20px">';
  if (IS_IOS && /CriOS|FxiOS|EdgiOS|NAVER|Whale|DaumApps/i.test(UA)) return openModal(head + `아이폰은 <b>사파리</b>에서만 설치돼요.<br>주소를 복사해서 사파리에 붙여 넣어 주세요.<button class="btn primary" style="width:100%;margin-top:12px" onclick="navigator.clipboard.writeText(location.origin+location.pathname).then(()=>toast('주소를 복사했어요'))">주소 복사</button></div>`, 'sm');
  if (IS_IOS) return openModal(head + `<ol class="ins-steps"><li>화면 아래 <b>공유 버튼(□↑)</b> 누르기</li><li>아래로 내려 <b>홈 화면에 추가</b></li><li>오른쪽 위 <b>추가</b></li></ol><p class="muted" style="font-size:12.5px">아이폰은 애플 정책상 이 단계만 직접 눌러야 해요.</p><div class="ins-arrow">⬇</div></div>`, 'sm');
  openModal(head + `<ol class="ins-steps"><li>브라우저 메뉴 <b>⋮</b> (삼성 인터넷은 <b>≡</b>)</li><li><b>앱 설치</b> 또는 <b>홈 화면에 추가</b></li><li><b>설치</b> 누르기</li></ol></div>`, 'sm');
}
function showInstall() {
  const box = $('install-box'), hb = $('hdr-install'), ua = UA, ios = IS_IOS, android = IS_AND;
  const showHdr = !isStandalone() && (ios || android || !!INSTALL_EVT);
  hb && hb.classList.toggle('hidden', !showHdr);
  if (isStandalone()) return box.classList.add('hidden');
  if (!ios && !android) return box.classList.add('hidden');
  let h;
  if (/KAKAOTALK/i.test(ua)) h = `카카오톡 안에서는 앱 설치가 안 돼요.<br><button class="btn primary" type="button" onclick="openExternal()">${ios ? '사파리' : '크롬'}로 열기</button>`;
  else if (INSTALL_EVT) h = `휴대폰 바탕화면에 앱으로 설치할 수 있어요.<br><button class="btn primary" type="button" onclick="doInstall()">📲 앱 설치</button>`;
  else if (ios) h = /CriOS|FxiOS|NAVER|Whale/i.test(ua) ? '앱 설치는 <b>사파리</b>에서 이 주소를 열어 주세요.' : '📲 앱 설치: 아래 <b>공유(□↑)</b> → <b>홈 화면에 추가</b>';
  else h = '📲 앱 설치: 브라우저 메뉴(⋮ 또는 ≡) → <b>앱 설치</b> / <b>홈 화면에 추가</b>';
  box.innerHTML = h; box.classList.remove('hidden');
}

const BUILD = '2026-11-14k';   // index.html 바꿀 때마다 올림 → 휴대폰 앱이 새 버전 자동 반영
async function checkUpdate() {
  try {
    const t = await (await fetch(location.pathname + '?v=' + Date.now(), { cache: 'reload' })).text();
    const m = t.match(/const BUILD = '([^']+)'/);
    if (m && m[1] !== BUILD && sessionStorage.getItem('aam_upd') !== m[1]) { sessionStorage.setItem('aam_upd', m[1]); location.reload(); }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
let OPEN_SET = false;   // ?settings 주소로 열면 로그인 뒤 설정 바로 열기
(async function init() {
  checkUpdate();
  showInstall();
  if (/KAKAOTALK/i.test(navigator.userAgent) && !sessionStorage.getItem('aam_ext')) { sessionStorage.setItem('aam_ext', '1'); setTimeout(openExternal, 300); }
  const p = new URLSearchParams(location.search);
  if (p.has('settings')) { OPEN_SET = true; history.replaceState(null, '', location.pathname); }
  if (p.get('id')) { PENDING_ID = p.get('id').toUpperCase(); history.replaceState(null, '', location.pathname + '#assets'); }
  if (await isAuthed()) startApp(); else { $('gate').classList.remove('hidden'); setTimeout(() => $('pw').focus(), 50); }
})();
</script>
