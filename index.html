<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#312e81">
<title>Aurora Asset Manager · 충남 현장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!--
  Aurora Asset Manager (개발 단계)
  ─────────────────────────────────
  · 이 파일 하나에 화면과 기능이 모두 들어 있어요.
  · 자산 데이터는 같은 GitHub 저장소의 assets.json 파일에 저장돼요. (앱에서 처음 저장할 때 자동 생성)
  · 코드 구성
      [1] 기본 설정 (CONFIG)      ← 비밀번호, 카카오 키, 저장소 이름 등 바꿀 값은 여기
      [2] 데이터 저장소 (Store)   ← 12월 Firebase 이전 때 이 구역만 바꾸면 됨
      [3] 로그인
      [4] 화면: 현황 / 자산 / 지도 / 라벨
      [5] 자산 상세·등록 패널
      [6] 엑셀 (양식·올리기·내보내기)
      [7] 설정 · 시작
-->
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--line:#e6e9f0;--line2:#d5dae4;--text:#141a2a;--sub:#667085;--muted:#98a2b3;
  --acc:#4338ca;--acc-d:#3730a3;--acc-bg:#eef0ff;
  --ok:#15803d;--ok-bg:#dcfce7;--use:#0369a1;--use-bg:#e0f2fe;--chk:#b45309;--chk-bg:#fef3c7;--off:#667085;--off-bg:#eef0f3;
  --red:#dc2626;--red-bg:#fee2e2;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:-.01em}
.muted{color:var(--muted)}
.sub{color:var(--sub);font-size:13.5px;margin:4px 0 0}
svg.i{flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 로그인 */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#1e1b4b;background-image:radial-gradient(circle at 20% 10%,#4338ca 0,transparent 45%),radial-gradient(circle at 90% 90%,#0e7490 0,transparent 40%)}
.gate-card{background:#fff;border-radius:22px;padding:36px 30px 28px;width:100%;max-width:360px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#4338ca,#0e7490);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.gate-card h1{font-size:21px;margin:18px 0 2px;letter-spacing:-.02em}
.gate-card form{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.pw{width:100%;font-size:22px;letter-spacing:.3em;text-align:center;padding:14px;border:1.5px solid var(--line2);border-radius:12px;outline:none}
.pw:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-bg)}
.gate-err{color:var(--red);font-size:13px;min-height:18px;text-align:center}
.remember{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);justify-content:center}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 레이아웃 */
#app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px 14px}
.brand{display:flex;gap:11px;align-items:center;padding:2px 8px 24px}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand small{color:var(--sub);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:11px 12px;border-radius:10px;color:#4b5565;font-weight:600;font-size:14.5px;text-align:left}
.nav-btn:hover{background:#f5f6fa}
.nav-btn.on{background:var(--acc-bg);color:var(--acc)}
.nav-btn .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.side-foot .nav-btn{font-size:13.5px;padding:9px 12px}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);padding:9px 12px;border-radius:10px;border:0;background:none;text-align:left;width:100%}
.sync:hover{background:#f5f6fa}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:#22c55e}.dot.local{background:#f59e0b}.dot.err{background:#ef4444}
.dot.saving,.dot.loading{background:#6366f1;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
main{padding:28px 34px 56px;min-width:0;max-width:1320px;width:100%}
.topbar,.tabbar{display:none}

/* 공통 요소 */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:25px;margin:0;letter-spacing:-.025em}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-group{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:#fff;padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{background:#f7f8fb}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc-d)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:13px 18px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:none;padding:8px;border-radius:9px;color:var(--sub);display:inline-grid;place-items:center}
.icon-btn:hover{background:#f1f3f7}
.link{border:0;background:none;color:var(--acc);font-weight:600;font-size:13px;padding:0}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px 3px 8px;border-radius:99px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{--c:var(--ok);--cb:var(--ok-bg)}.use{--c:var(--use);--cb:var(--use-bg)}.chk{--c:var(--chk);--cb:var(--chk-bg)}.off{--c:var(--off);--cb:var(--off-bg)}
.badge.ok,.badge.use,.badge.chk,.badge.off{color:var(--c);background:var(--cb)}
.due{font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap;display:inline-block}
.due.red{color:var(--red);background:var(--red-bg)}.due.amber{color:var(--chk);background:var(--chk-bg)}.due.gray{color:var(--sub);background:#f1f3f6}
.empty{text-align:center;padding:34px 10px;color:var(--sub)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:0 12px;color:var(--muted);min-width:0}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-bg)}
.search input{border:0;outline:none;padding:10px 0;flex:1;min-width:0;background:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:#fff;padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;color:#4b5565}
.chip.on{background:var(--text);border-color:var(--text);color:#fff}
.sel{border:1px solid var(--line2);border-radius:10px;padding:9px 10px;background:#fff}

/* 현황 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 14px;text-align:left;position:relative;overflow:hidden}
.stat:hover{border-color:var(--line2);box-shadow:0 3px 10px rgba(16,24,40,.06)}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--acc))}
.stat .lbl{font-size:13px;color:var(--sub);font-weight:600}
.stat .num{font-size:32px;font-weight:800;margin-top:4px;letter-spacing:-.03em;color:var(--c,var(--text))}
.stat .num small{font-size:14px;font-weight:600;color:var(--sub);margin-left:3px}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
.count{background:var(--red-bg);color:var(--red);font-size:12px;padding:1px 8px;border-radius:99px}
.row-item{display:flex;align-items:center;gap:12px;padding:11px 10px;margin:0 -10px;border-radius:10px;cursor:pointer}
.row-item:hover{background:#f7f8fb}
.row-item + .row-item{box-shadow:0 -1px 0 #f0f2f6}
.ri-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ri-icon.red{background:var(--red-bg);color:var(--red)}.ri-icon.amber{background:var(--chk-bg);color:var(--chk)}
.ri-main{flex:1;min-width:0}
.ri-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-sub{font-size:12.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 자산 목록 */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar .search{flex:1 1 260px;max-width:380px}
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12.5px;color:var(--sub);font-weight:600;padding:11px 14px;background:#fafbfc;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 14px;border-bottom:1px solid #f0f2f6;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#f8f9fc}
.tbl .nm{font-weight:600}
.tbl .chev{color:var(--muted);width:30px}
.mlist{display:none}
.mcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:10px;cursor:pointer}
.mc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mc-name{font-size:16px;font-weight:700;margin:6px 0 3px;letter-spacing:-.01em}
.mc-sub{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:4px}
.mc-due{margin-top:9px}

/* 패널 (상세·등록) */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.38);display:flex;justify-content:flex-end}
.panel{background:#fff;width:460px;max-width:100%;height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.12);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.p-head h2{font-size:20px;margin:3px 0 0;letter-spacing:-.02em;line-height:1.3}
.p-body{flex:1;overflow:auto;padding:18px 20px 24px}
.p-foot{display:flex;gap:8px;padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.p-foot .btn{flex:1}
.flabel{font-size:13px;font-weight:700;color:#344054;margin:0 0 7px;display:flex;gap:4px;align-items:center}
.flabel em{color:var(--red);font-style:normal}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:20px}
.seg button{border:1.5px solid var(--line2);background:#fff;border-radius:10px;padding:11px 4px;font-weight:700;font-size:13.5px;color:#4b5565}
.seg button.on{border-color:var(--c);background:var(--cb);color:var(--c)}
.info{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.info>div{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid #f0f2f6;align-items:baseline}
.info>div:last-child{border-bottom:0}
.info dt{width:78px;flex:none;color:var(--sub);font-size:13px}
.info dd{margin:0;flex:1;min-width:0;font-weight:500;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.qr-box{display:flex;gap:16px;align-items:center;margin-top:16px;padding:14px;border:1px dashed var(--line2);border-radius:12px}
.qr-box img{width:92px;height:92px;flex:none;image-rendering:pixelated}
.field{margin-bottom:18px}
.inp{width:100%;border:1px solid var(--line2);border-radius:10px;padding:11px 12px;outline:none;background:#fff;font-size:15px}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-bg)}
textarea.inp{min-height:70px;resize:vertical}
.cat-chips{display:flex;flex-wrap:wrap;gap:6px}
.cat-chips .chip{padding:9px 14px;font-size:14px}
.cat-chips .chip.on{background:var(--acc);border-color:var(--acc)}
.coord-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.coord-btns{display:flex;gap:8px;margin-top:8px}
.coord-btns .btn{flex:1}
details.more{border-top:1px solid var(--line);padding-top:14px}
details.more summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--sub);margin-bottom:14px;list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸";transition:.15s}
details[open].more summary::before{transform:rotate(90deg)}
.ferr{color:var(--red);font-size:13px;font-weight:600;margin-top:-6px;margin-bottom:12px}

/* 모달 */
.modal-wrap{position:fixed;inset:0;z-index:60;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:860px}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 12px}
.m-head h2{margin:0;font-size:18px}
.m-body{padding:0 20px 16px;overflow:auto}
.m-foot{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);align-items:center}
.sp{flex:1}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.set-grid label,.set-one{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:#344054}
.set-one{margin-top:10px}
.hint{font-size:12.5px;color:var(--sub);margin:6px 0 0;line-height:1.55}
.set-block{padding:14px 0;border-top:1px solid var(--line)}
.set-block:first-child{border-top:0;padding-top:4px}
.set-block h3{margin:0 0 2px;font-size:14.5px}
.test-res{font-size:13px;font-weight:600;margin-top:8px}
.sum-chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.sum-chips span{font-size:13px;font-weight:700;padding:5px 11px;border-radius:99px}
.t-new{background:var(--ok-bg);color:var(--ok)}.t-update{background:var(--use-bg);color:var(--use)}.t-error{background:var(--red-bg);color:var(--red)}.t-same{background:#f1f3f6;color:var(--sub)}
.plan{width:100%;border-collapse:collapse;font-size:13px}
.plan th{text-align:left;color:var(--sub);font-weight:600;padding:8px;border-bottom:1px solid var(--line);background:#fafbfc;position:sticky;top:0}
.plan td{padding:9px 8px;border-bottom:1px solid #f0f2f6;vertical-align:top}
.plan .tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.chg{color:var(--sub)} .chg b{color:var(--use)}
.pmap{width:100%;height:56vh;min-height:300px;border-radius:12px;background:#e9edf3;overflow:hidden}
.pick-coord{margin-top:10px;font-size:13.5px;color:var(--sub)}
.guide{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:14.5px;line-height:1.55}
.guide b{color:var(--acc)}

/* 지도 */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:50%;background:var(--c);display:inline-block}
.map-layout{display:grid;grid-template-columns:300px 1fr;gap:14px;height:calc(100vh - 150px);min-height:460px}
.map-list{background:#fff;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.map-list .search{margin:12px}
.map-items{overflow:auto;flex:1;padding:0 6px 8px}
.mi{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.mi:hover,.mi.on{background:var(--acc-bg)}
.mi i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.map-box{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#e9edf3;position:relative}
#kmap{width:100%;height:100%}
.map-fail{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--sub);gap:6px}
.map-fail b{color:var(--text);font-size:15px}
.pin{width:20px;height:20px;border-radius:50%;border:3px solid #fff;background:var(--c);box-shadow:0 1px 5px rgba(0,0,0,.4);padding:0;display:block}
.pin.big{width:26px;height:26px}
.mapcard{background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.2);padding:12px 14px;min-width:210px;max-width:260px;font-size:13px;position:relative}
.mapcard::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.mapcard b{display:block;font-size:14px;margin:4px 0 2px;white-space:normal}
.mapcard .btn{margin-top:10px;width:100%}

/* 라벨 */
.lab-layout{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.lab-pick{padding:14px;position:sticky;top:20px}
.lab-row{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 6px;font-size:13px;color:var(--sub)}
.lab-row div{display:flex;gap:12px}
.lab-items{max-height:calc(100vh - 260px);overflow:auto;margin:0 -6px}
.lab-it{display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:9px;cursor:pointer}
.lab-it:hover{background:#f7f8fb}
.lab-it input{width:17px;height:17px;accent-color:var(--acc);flex:none}
.lab-preview{min-width:0}
.sheet-scale{transform-origin:top left}
.sheet-gap{height:16px}
.prev-note{font-size:12.5px;color:var(--sub);margin:0 0 10px}

/* 라벨 실물 크기 (인쇄·미리보기 공통) */
.sheet{background:#fff;display:grid;grid-auto-rows:70mm;align-content:center;justify-content:center;box-shadow:0 2px 14px rgba(16,24,40,.12);overflow:hidden}
.paper-seg{display:inline-grid;grid-template-columns:1fr 1fr;background:#eef0f3;border-radius:11px;padding:3px;gap:3px}
.paper-seg button{border:0;background:none;border-radius:8px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--sub)}
.paper-seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.paper-seg small{font-weight:500;margin-left:4px}
.dues{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.label{width:70mm;height:70mm;border:.3mm dashed #9aa3b2;display:flex;flex-direction:column;align-items:center;padding:3.5mm 4mm 3mm;color:#111;font-family:inherit}
.lb-top{width:100%;display:flex;justify-content:space-between;font-size:7.5pt;font-weight:700;color:#4338ca;letter-spacing:.04em}
.lb-top span:last-child{color:#555;letter-spacing:0}
.lb-qr{width:43mm;height:43mm;margin-top:2mm;image-rendering:pixelated}
.lb-qr.none{display:grid;place-items:center;border:1px solid #ccc;font-size:8pt;color:#999}
.lb-id{font-size:17pt;font-weight:800;letter-spacing:.02em;margin-top:1.6mm;line-height:1}
.lb-name{font-size:8.5pt;font-weight:600;text-align:center;line-height:1.25;margin-top:1.3mm;max-height:2.5em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;width:100%}
#print-area{display:none}

/* 토스트 */
#toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#111827;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s ease-out;max-width:90vw}
.toast.err{background:#b91c1c}.toast.warn{background:#92400e}
@keyframes tin{from{transform:translateY(10px);opacity:0}}

/* 휴대폰 */
@media (max-width:899px){
  #app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 12px 10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
  .topbar .logo{width:32px;height:32px;font-size:15px;border-radius:9px}
  .topbar b{font-size:15px;flex:1}
  .topbar .sync{width:auto;padding:6px 8px}
  .tabbar{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
  .tab.on{color:var(--acc)}
  .tab .cnt{position:absolute;top:5px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:0 5px;border-radius:99px}
  main{padding:18px 14px 96px}
  h1{font-size:22px}
  .page-head{align-items:center;margin-bottom:14px}
  .desktop-only{display:none!important}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat .num{font-size:28px}
  .grid2{grid-template-columns:1fr}
  .toolbar .search{max-width:none;flex-basis:100%}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .toolbar .sel{display:none}
  .tbl-wrap{display:none}
  .mlist{display:block}
  .panel{width:100%}
  .map-layout{grid-template-columns:1fr;height:calc(100vh - 205px)}
  .map-list{display:none}
  .modal-wrap{padding:0;align-items:flex-end}
  .modal{border-radius:18px 18px 0 0;max-height:94vh}
  .set-grid{grid-template-columns:1fr}
  #toasts{bottom:86px}
}
@media print{
  body{background:#fff}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  .sheet{box-shadow:none;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<script>
/* ═══════════════════════════════════════════

const CONFIG = {

const CATEGORIES = ['장비', '공구', '자재', '전기설비', '측정기', '비품'];

function seedDoc() {
  const t = '2026-11-10T09:00:00+09:00';

    { id: 'AUR-001', name: 'OSBL 메인 배관 파이프 자재 (STS 304)', category: '자재', location: 'OSBL 야적장 A구역', lat: 36.7801, lng: 126.5502, status: '정상', nextCheck: '', rentalDue: '', note: '', updatedAt: t },

    { id: 'AUR-003', name: '고소작업대 (렌탈 장비)', category: '장비', location: 'OSBL B구역 외곽', lat: 36.7795, lng: 126.5490, status: '정상', nextCheck: '', rentalDue: '2026-11-20', note: '', updatedAt: t },

  ]};
}

/* ═══════════════════════════════════════════
   공통 도구
   ═══════════════════════════════════════════ */
const ICONS = {
  home: '<path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',

  pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  tag: '<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1"/>',
  settings: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13l4 4M12 13l-4 4"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>',
  crosshair: '<circle cx="12" cy="12" r="9"/><path d="M22 12h-4M6 12H2M12 6V2M12 22v-4"/>',
  printer: '<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
  edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  alert: '<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  chev: '<path d="M9 18l6-6-6-6"/>',
  map: '<path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4z"/><path d="M8 2v16M16 6v16"/>'
};
function icon(n, s = 18) { return `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24">${ICONS[n] || ''}</svg>`; }
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
function dday(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); const t = new Date(); return Math.round((new Date(y, m - 1, d) - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 864e5); }
function ddText(n) { return n < 0 ? `${-n}일 지남` : n === 0 ? '오늘' : `D-${n}`; }
function todayLabel() { const d = new Date(); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`; }
function relTime(iso) {
  if (!iso) return '—';
  const m = Math.round((Date.now() - new Date(iso)) / 6e4);
  if (m < 1) return '방금'; if (m < 60) return `${m}분 전`;
  const h = Math.round(m / 60); if (h < 24) return `${h}시간 전`;
  const d = Math.round(h / 24); if (d < 30) return `${d}일 전`;
  return ymd(new Date(iso));
}
const hasCoord = a => Number.isFinite(+a.lat) && Number.isFinite(+a.lng) && a.lat !== '' && a.lng !== '' && a.lat != null;
const validLat = v => Number.isFinite(v) && v >= 33 && v <= 39;
const validLng = v => Number.isFinite(v) && v >= 124 && v <= 132;
function badge(s) { return `<span class="badge ${ST_KEY[s] || 'off'}">${esc(s)}</span>`; }
function toast(msg, type = '') {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg;
  $('toasts').appendChild(el); setTimeout(() => el.remove(), type === 'err' ? 5000 : 2600);
}
async function sha256(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function b64encode(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(b64) {
  const bin = atob(b64.replace(/\s/g, '')); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* ═══════════════════════════════════════════
   [2] 데이터 저장소 — GitHub assets.json
   · load()   : 데이터 불러오기
   · commit() : 최신 데이터를 다시 읽어 변경을 적용한 뒤 저장 (여러 기기가 동시에 저장해도 덮어쓰지 않음)
   · 토큰이 없으면 '로컬 모드' — 이 기기 브라우저에만 저장
   ※ 12월 Firebase 이전 시 이 객체의 load / commit 만 Firestore 용으로 바꾸면 됩니다.
   ═══════════════════════════════════════════ */
function normalizeDoc(d) {
  const doc = d && Array.isArray(d.assets) ? d : { version: 1, assets: [] };
  doc.assets = doc.assets.filter(a => a && a.id).map(a => ({
    id: String(a.id), name: a.name || '', category: a.category || '', location: a.location || '',
    lat: a.lat === '' || a.lat == null ? '' : Number(a.lat), lng: a.lng === '' || a.lng == null ? '' : Number(a.lng),
    status: STATUSES.includes(a.status) ? a.status : '정상', nextCheck: a.nextCheck || '', rentalDue: a.rentalDue || '',
    note: a.note || '', updatedAt: a.updatedAt || ''
  }));
  return doc;
}
const Store = {
  cfg() { return { ...CONFIG.GITHUB, token: '', qrBase: '', ...(lsGet('aam_settings') || {}) }; },
  saveCfg(c) { lsSet('aam_settings', c); },
  mode() { return this.cfg().token ? 'github' : 'local'; },
  url(c = this.cfg()) { return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}`; },
  headers(json, c = this.cfg()) {
    const h = { Accept: 'application/vnd.github+json' };
    if (c.token) h.Authorization = 'Bearer ' + c.token;
    if (json) h['Content-Type'] = 'application/json';
    return h;
  },
  async readRemote() {
    const c = this.cfg();
    const get = cc => fetch(this.url(cc) + '?ref=' + encodeURIComponent(cc.branch) + '&_=' + Date.now(), { headers: this.headers(false, cc), cache: 'no-store' });
    let r = await get(c);
    this.tokenBad = false;
    if (r.status === 401 && c.token) {   // 토큰이 틀려도 공개 저장소는 읽을 수 있게 (저장만 막힘)
      this.tokenBad = true;
      r = await get({ ...c, token: '' });
    }
    if (r.status === 404) return { doc: null, sha: null };
    if (!r.ok) throw new Error(ghErr(r.status));
    const j = await r.json();
    return { doc: normalizeDoc(JSON.parse(b64decode(j.content))), sha: j.sha };
  },
  async load() {
    if (this.mode() === 'local') {
      const local = lsGet('aam_local'); if (local) return normalizeDoc(local);
      try { const { doc } = await this.readRemote(); if (doc) return doc; } catch (e) {}
      return normalizeDoc(lsGet('aam_cache') || seedDoc());
    }
    const { doc } = await this.readRemote();
    return doc || normalizeDoc(lsGet('aam_local') || lsGet('aam_cache') || seedDoc());
  },
  async commit(mutator, message) {
    if (this.mode() === 'local') {
      const next = structuredClone(DOC); const result = mutator(next);
      next.updatedAt = new Date().toISOString(); lsSet('aam_local', next);
      return { doc: next, result };
    }
    const c = this.cfg();
    for (let attempt = 0; attempt < 3; attempt++) {
      const { doc, sha } = await this.readRemote();
      const next = structuredClone(doc || normalizeDoc(lsGet('aam_local') || DOC || seedDoc()));
      const result = mutator(next);
      next.updatedAt = new Date().toISOString();
      const body = { message: message + ' (Aurora 앱)', content: b64encode(JSON.stringify(next, null, 2) + '\n'), branch: c.branch };
      if (sha) body.sha = sha;
      const r = await fetch(this.url(c), { method: 'PUT', headers: this.headers(true, c), body: JSON.stringify(body) });
      if (r.ok) { localStorage.removeItem('aam_local'); lsSet('aam_cache', next); return { doc: next, result }; }
      if ((r.status === 409 || r.status === 422) && attempt < 2) continue;
      throw new Error(ghErr(r.status));
    }
  }
};
function ghErr(s) {
  return s === 401 ? '토큰이 올바르지 않아요 (401)' : s === 403 ? '권한이 없거나 요청 한도를 넘었어요 (403)'
    : s === 404 ? '저장소를 찾을 수 없어요 (404)' : `GitHub 오류 (${s})`;
}
function nextId(doc) {
  const max = doc.assets.reduce((m, a) => { const n = parseInt(String(a.id).replace(/\D/g, ''), 10); return Number.isFinite(n) && n > m ? n : m; }, 0);
  return 'AUR-' + String(max + 1).padStart(3, '0');
}
function qrBase() {
  const c = Store.cfg(); if (c.qrBase) return c.qrBase;
  if (location.protocol.startsWith('http')) return location.origin + location.pathname.replace(/index\.html$/, '');
  return CONFIG.QR_BASE_DEFAULT;
}
const qrUrl = id => qrBase() + '?id=' + encodeURIComponent(id);

/* 앱 상태 */
let DOC = null;
let DRAWER = null;          // {mode:'detail'|'form', id, draft}
let PENDING_ID = null;      // QR로 들어온 자산번호
const UI = { q: '', status: '전체', cat: '전체', mapQ: '', labQ: '', labSel: new Set(), paper: lsGet('aam_paper') === 'A3' ? 'A3' : 'A4' };
const getAsset = id => DOC.assets.find(a => a.id === id);
const activeAssets = () => DOC.assets.filter(a => a.status !== '폐기');

function setSync(state, msg = '') {
  const t = { ok: 'GitHub 저장됨 · ' + new Date().toTimeString().slice(0, 5), local: '로컬 모드 · 이 기기에만 저장', saving: '저장 중…', loading: '불러오는 중…', err: '연결 오류 · 눌러서 다시 시도', ro: '토큰 오류 · 보기만 가능' }[state];
  document.querySelectorAll('[data-sync-dot]').forEach(d => d.className = 'dot ' + (state === 'ro' ? 'err' : state));
  document.querySelectorAll('[data-sync-text]').forEach(d => d.textContent = t);
  document.querySelectorAll('.sync').forEach(b => b.title = msg || t);
}
async function reloadData() {
  setSync('loading');

function isAuthed() {

async function login(e) {
  e.preventDefault();

  try { h = await sha256($('pw').value); } catch (x) { err.textContent = '이 브라우저에서는 로그인할 수 없어요 (https 주소로 열어주세요)'; return; }

function todos() {   // 자산 한 개당 한 줄, 해당 일정 표시(tags)를 모아서
  const out = [];
  activeAssets().forEach(a => {
    const tags = [];
    if (a.status === '점검필요') tags.push({ level: 'red', text: '점검 필요', rank: -1000 });
    const c = dday(a.nextCheck);
    if (c !== null && c <= 7 && a.status !== '점검필요') tags.push({ level: c < 0 ? 'red' : 'amber', text: '점검 ' + ddText(c), rank: c });
    const r = dday(a.rentalDue);
    if (r !== null && r <= 14) tags.push({ level: r < 0 ? 'red' : 'amber', text: '렌탈 반납 ' + ddText(r), rank: r, rental: true });
    if (!tags.length) return;
    tags.sort((x, y) => x.rank - y.rank);
    out.push({ a, tags, level: tags.some(t => t.level === 'red') ? 'red' : 'amber', rank: tags[0].rank, rentalOnly: tags.every(t => t.rental) });

let KAKAO_P = null, MAP = null, MAP_INFO = null, MAP_FOCUS = null;
function loadKakao() {
  if (window.kakao && kakao.maps && kakao.maps.LatLng) return Promise.resolve();
  if (KAKAO_P) return KAKAO_P;
  KAKAO_P = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey=' + CONFIG.KAKAO_KEY;
    const to = setTimeout(() => rej(new Error('timeout')), 10000);
    s.onload = () => { try { kakao.maps.load(() => { clearTimeout(to); res(); }); } catch (e) { clearTimeout(to); rej(e); } };
    s.onerror = () => { clearTimeout(to); rej(new Error('load')); };
    document.head.appendChild(s);
  });
  KAKAO_P.catch(() => { KAKAO_P = null; });
  return KAKAO_P;
}

async function initMainMap() {
  updateMapList();
  const box = $('kmap'); if (!box) return;
  try { await loadKakao(); } catch (e) { box.parentElement.insertAdjacentHTML('beforeend', mapFail()); return; }
  if (!document.body.contains(box)) return;
  MAP = new kakao.maps.Map(box, { center: new kakao.maps.LatLng(...CONFIG.MAP_CENTER), level: 4 });
  MAP.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  MAP_INFO = null;
  const bounds = new kakao.maps.LatLngBounds(); const list = mapAssets();
  list.forEach(a => {

    el.addEventListener('click', ev => { ev.stopPropagation(); mapSelect(a.id); });
    const pos = new kakao.maps.LatLng(a.lat, a.lng);
    new kakao.maps.CustomOverlay({ position: pos, content: el, xAnchor: .5, yAnchor: .5, zIndex: 2 }).setMap(MAP);
    bounds.extend(pos);

}

  const rows = DOC.assets.map(a => [...XL_COLS.map(([, k]) => a[k] ?? ''), a.updatedAt ? new Date(a.updatedAt).toLocaleString('ko-KR') : '']);
  const ws = XLSX.utils.aoa_to_sheet([[...XL_COLS.map(c => c[0]), '최종변경'], ...rows]);
  ws['!cols'] = [10, 34, 10, 26, 10, 11, 11, 13, 13, 26, 20].map(w => ({ wch: w }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '자산대장');
  XLSX.writeFile(wb, `Aurora_자산대장_${todayStr()}.xlsx`);
}
const cellStr = v => v == null ? '' : String(v).trim();
function cellDate(v) {
  if (v === '' || v == null) return '';
  if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 864e5)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  const m = String(v).trim().match(/^(\d{4})[-./ ]\s*(\d{1,2})[-./ ]\s*(\d{1,2})\.?$/);
  return m ? `${m[1]}-${pad(m[2])}-${pad(m[3])}` : null;
}
let PLAN = [];
async function handleExcel(inp) {
  const f = inp.files[0]; inp.value = ''; if (!f || !needXLSX()) return;
  let rows;
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: true });
  } catch (e) { return toast('엑셀 파일을 읽을 수 없어요', 'err'); }
  PLAN = buildPlan(rows); openPlan(f.name);
}
function buildPlan(rows) {
  const byId = new Map(DOC.assets.map(a => [a.id, a])); const seen = new Set(); const out = [];
  rows.forEach((raw, i) => {
    const r = {}; Object.keys(raw).forEach(k => { const key = XL_ALIAS[String(k).replace(/\s/g, '')]; if (key) r[key] = raw[k]; });
    if (!Object.values(r).some(v => cellStr(v))) return;
    const errs = [], f = {}, id = cellStr(r.id).toUpperCase();
    ['name', 'location', 'note'].forEach(k => { const v = cellStr(r[k]); if (v) f[k] = v; });
    const cat = cellStr(r.category); if (cat) CATEGORIES.includes(cat) ? f.category = cat : errs.push(`분류 '${cat}'는 쓸 수 없어요`);
    const st = cellStr(r.status); if (st) STATUSES.includes(st) ? f.status = st : errs.push(`상태 '${st}'는 쓸 수 없어요`);
    const la = cellStr(r.lat), ln = cellStr(r.lng);
    if (la || ln) { const a = parseFloat(la), b = parseFloat(ln); validLat(a) && validLng(b) ? (f.lat = +a.toFixed(6), f.lng = +b.toFixed(6)) : errs.push('위도/경도를 확인해 주세요'); }
    [['nextCheck', '다음점검일'], ['rentalDue', '렌탈반납일']].forEach(([k, h]) => { if (cellStr(r[k])) { const d = cellDate(r[k]); d ? f[k] = d : errs.push(`${h} 날짜 형식(2026-12-01)을 확인해 주세요`); } });
    let type, changes = [];
    if (id) {
      if (seen.has(id)) errs.push('같은 자산번호가 파일에 두 번 있어요'); seen.add(id);
      const cur = byId.get(id);
      if (!cur) errs.push(`${id}는 없는 자산번호예요 (새 자산은 자산번호를 비워두세요)`);
      else { changes = Object.keys(f).filter(k => String(cur[k] ?? '') !== String(f[k])).map(k => ({ k, from: cur[k], to: f[k] })); type = changes.length ? 'update' : 'same'; }
    } else {
      if (!f.name) errs.push('품명이 없어요'); if (!f.location) errs.push('위치가 없어요'); if (!cat) errs.push('분류가 없어요');
      if (!f.status) f.status = '정상'; type = 'new';
    }
    if (errs.length) type = 'error';
    out.push({ line: i + 2, type, id, f, changes, errs, name: f.name || (byId.get(id) || {}).name || '' });
  });
  return out;
}
const FIELD_KO = Object.fromEntries(XL_COLS.map(([h, k]) => [k, h]));
const TYPE_KO = { new: '신규', update: '변경', error: '오류', same: '그대로' };
function openPlan(fname) {
  const n = t => PLAN.filter(p => p.type === t).length; const ok = n('new') + n('update');
  const detail = p => p.type === 'error' ? `<span style="color:var(--red)">${p.errs.map(esc).join('<br>')}</span>`
    : p.type === 'update' ? p.changes.map(c => `<div class="chg">${FIELD_KO[c.k]}: ${esc(c.from || '(빈칸)')} → <b>${esc(c.to)}</b></div>`).join('')
    : p.type === 'new' ? `<span class="chg">${esc(p.f.category || '')} · ${esc(p.f.location || '')} · ${esc(p.f.status)}</span>` : '<span class="muted">바뀐 내용 없음</span>';
  openModal(`
    <div class="m-head"><h2>엑셀 반영 미리보기</h2><button class="icon-btn" onclick="closeModal()">${icon('x', 20)}</button></div>
    <div class="m-body">
      <p class="sub" style="margin:0 0 8px">${esc(fname)} · ${PLAN.length}줄</p>
      <div class="sum-chips"><span class="t-new">신규 ${n('new')}</span><span class="t-update">변경 ${n('update')}</span><span class="t-error">오류 ${n('error')}</span><span class="t-same">그대로 ${n('same')}</span></div>
      ${PLAN.length ? `<table class="plan"><thead><tr><th>줄</th><th>구분</th><th>자산번호</th><th>품명</th><th>내용</th></tr></thead><tbody>
        ${PLAN.map(p => `<tr><td>${p.line}</td><td><span class="tag t-${p.type}">${TYPE_KO[p.type]}</span></td><td class="mono">${p.id ? esc(p.id) : '<span class="muted">자동</span>'}</td><td>${esc(p.name)}</td><td>${detail(p)}</td></tr>`).join('')}
      </tbody></table>` : `<div class="empty"><b>읽을 내용이 없어요</b>첫 줄이 '자산번호, 품명, 분류…' 제목인지 확인해 주세요</div>`}
      ${n('error') ? `<p class="hint">오류가 있는 줄은 빼고 반영돼요. 엑셀을 고쳐서 다시 올리면 돼요.</p>` : ''}
    </div>
    <div class="m-foot"><span class="sp"></span><button class="btn" onclick="closeModal()">취소</button>
      <button class="btn primary" id="plan-go" ${ok ? '' : 'disabled'} onclick="applyPlan()">${ok}건 반영하기</button></div>`, 'wide');
}
async function applyPlan() {
  const items = PLAN.filter(p => p.type === 'new' || p.type === 'update'); if (!items.length) return;
  $('plan-go').disabled = true; $('plan-go').textContent = '반영 중…';
  const res = await saveChange(doc => {
    const now = new Date().toISOString(); let added = 0, updated = 0;
    items.forEach(p => {
      if (p.type === 'new') { doc.assets.push({ id: nextId(doc), name: '', category: '', location: '', status: '정상', lat: '', lng: '', nextCheck: '', rentalDue: '', note: '', ...p.f, updatedAt: now }); added++; }
      else { const a = doc.assets.find(x => x.id === p.id); if (a) { p.changes.forEach(c => a[c.k] = c.to); a.updatedAt = now; updated++; } }
    });
    return { added, updated };
  }, `엑셀 반영: 신규 ${items.filter(p => p.type === 'new').length}건 · 변경 ${items.filter(p => p.type === 'update').length}건`);
  if (res) { closeModal(); toast(`신규 ${res.added}건 · 변경 ${res.updated}건을 반영했어요`); }
  else if ($('plan-go')) { $('plan-go').disabled = false; $('plan-go').textContent = `${items.length}건 반영하기`; }
}

/* ═══════════════════════════════════════════
   [7] 설정 · 시작
   ═══════════════════════════════════════════ */
function openSettings() {
  const c = Store.cfg();
  openModal(`
    <div class="m-head"><h2>설정</h2><button class="icon-btn" onclick="closeModal()">${icon('x', 20)}</button></div>
    <div class="m-body">
      <div class="set-block">
        <h3>데이터 저장소 (GitHub)</h3>
        <p class="hint" style="margin:2px 0 12px">현재: <b>${Store.mode() === 'github' ? 'GitHub에 저장 중 — 모든 기기가 같은 데이터를 봐요' : '로컬 모드 — 이 기기에만 저장돼요'}</b></p>
        <div class="set-grid">
          <label>저장소 주인<input class="inp" id="s-owner" value="${esc(c.owner)}"></label>
          <label>저장소 이름<input class="inp" id="s-repo" value="${esc(c.repo)}"></label>
          <label>브랜치<input class="inp" id="s-branch" value="${esc(c.branch)}"></label>
          <label>데이터 파일<input class="inp" id="s-path" value="${esc(c.path)}"></label>
        </div>
        <label class="set-one">GitHub 토큰<input class="inp" id="s-token" type="password" value="${esc(c.token)}" placeholder="github_pat_…" autocomplete="off"></label>
        <p class="hint">토큰 만드는 곳: GitHub → Settings → Developer settings → Fine-grained tokens → Generate.<br>
          Repository access는 <b>이 저장소만</b>, Permissions는 <b>Contents: Read and write</b> 하나만 주세요.<br>토큰은 이 기기 브라우저에만 저장되고, 코드나 데이터 파일에는 들어가지 않아요.</p>
        <div id="s-test" class="test-res"></div>
      </div>
      <div class="set-block">
        <h3>라벨 QR 주소</h3>
        <input class="inp" id="s-qr" value="${esc(c.qrBase)}" placeholder="${esc(CONFIG.QR_BASE_DEFAULT)}">
        <p class="hint">QR을 찍었을 때 열릴 앱 주소예요. 비워두면 지금 열린 주소(또는 기본값)를 써요.</p>
      </div>
    </div>
    <div class="m-foot"><button class="btn" onclick="testConn()">연결 확인</button><span class="sp"></span>
      <button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveSettings()">저장</button></div>`);
}
function readSettingsForm() {
  return { owner: $('s-owner').value.trim(), repo: $('s-repo').value.trim(), branch: $('s-branch').value.trim() || 'main', path: $('s-path').value.trim() || 'assets.json', token: $('s-token').value.trim(), qrBase: $('s-qr').value.trim() };
}
async function testConn() {
  const c = readSettingsForm(), out = $('s-test');
  out.style.color = 'var(--sub)'; out.textContent = '확인 중…';
  try {
    const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`, { headers: Store.headers(false, c), cache: 'no-store' });
    if (!r.ok) throw new Error(ghErr(r.status));
    const f = await fetch(Store.url(c) + '?ref=' + encodeURIComponent(c.branch), { headers: Store.headers(false, c), cache: 'no-store' });
    out.style.color = 'var(--ok)';
    out.textContent = '✓ 저장소에 연결됐어요 · ' + (f.ok ? `${c.path} 파일이 있어요` : `${c.path} 파일은 첫 저장 때 만들어져요`) + (c.token ? '' : ' (토큰이 없어 읽기만 가능)');
  } catch (e) { out.style.color = 'var(--red)'; out.textContent = '✕ ' + e.message; }
}
function saveSettings() {
  const c = readSettingsForm(); const before = Store.mode();
  Store.saveCfg(c); Object.keys(QR_CACHE).forEach(k => delete QR_CACHE[k]);
  closeModal(); toast('설정을 저장했어요');
  if (before === 'local' && c.token && lsGet('aam_local')) toast('이 기기에서 만든 데이터는 다음 저장 때 GitHub에 올라가요 (GitHub에 데이터가 없을 때만)', 'warn');
  reloadData();
}
function startApp() {
  $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
  document.querySelectorAll('[data-ic]').forEach(el => el.outerHTML = icon(el.dataset.ic));
  DOC = normalizeDoc((Store.mode() === 'local' ? lsGet('aam_local') : null) || lsGet('aam_cache') || seedDoc());
  render(); reloadData();
}
window.addEventListener('hashchange', () => { closeMapInfo(); render(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('modal').classList.contains('hidden')) closeModal(); else closeDrawer(); } });
let RESIZE_T; window.addEventListener('resize', () => { clearTimeout(RESIZE_T); RESIZE_T = setTimeout(() => { if (currentView() === 'labels') updateLabelPreview(); if (MAP) MAP.relayout(); }, 150); });

(function init() {
