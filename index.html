<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Asset Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Kakao Maps API -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=77c97bf1b0283e37f4ca3c548d45e5e6"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Aurora Asset Manager (충남 현장)</h1>
            <div class="flex items-center space-x-3">
                <span id="auth-badge" class="bg-blue-800 text-xs px-2 py-1 rounded">모드: 일반 사용자</span>
                <button onclick="openLoginModal()" id="login-toggle-btn" class="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-1 rounded">관리자 로그인</button>
            </div>
        </div>
    </header>

    <!-- 네비게이션 탭 -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 flex space-x-6 py-3 text-sm font-semibold">
            <button onclick="switchTab('dashboard')" id="btn-dashboard" class="text-blue-600 border-b-2 border-blue-600 pb-1">📊 통합 대시보드</button>
            <button onclick="switchTab('map')" id="btn-map" class="text-gray-500 hover:text-blue-600 pb-1">🗺️ 현장 지도 보기 (Kakao)</button>
            <button onclick="switchTab('excel')" id="btn-excel" class="text-gray-500 hover:text-blue-600 pb-1">📁 엑셀 증분 업로드 & QR</button>
        </div>
    </nav>

    <!-- 메인 컨테이너 -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- 1. 대시보드 탭 -->
        <div id="tab-dashboard" class="space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-800">현장 자산 관리 대장</h2>
                <span class="text-sm text-gray-500">충남 오로라 프로젝트 통합 자산 현황</span>
            </div>
            <div class="bg-white rounded-lg shadow p-4 overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-50 text-gray-700">
                            <th class="p-2 border">자산번호</th>
                            <th class="p-2 border">품명 및 규격</th>
                            <th class="p-2 border">설치 위치</th>
                            <th class="p-2 border">상태</th>
                        </tr>
                    </thead>
                    <tbody id="asset-table-body">
                        <tr>
                            <td class="p-2 border">AUR-001</td>
                            <td class="p-2 border">배관 자재 (STS 304)</td>
                            <td class="p-2 border">OSBL 야적장</td>
                            <td class="p-2 border text-green-600 font-semibold">정상</td>
                        </tr>
                        <tr>
                            <td class="p-2 border">AUR-002</td>
                            <td class="p-2 border">용접기 (Inverter)</td>
                            <td class="p-2 border">ISBL 메인동</td>
                            <td class="p-2 border text-blue-600 font-semibold">사용중</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 2. 지도 탭 (Kakao Maps) -->
        <div id="tab-map" class="hidden space-y-4">
            <h2 class="text-lg font-bold text-gray-800">현장 위치 지도 (카카오 맵)</h2>
            <p class="text-sm text-gray-500">카카오 지도를 통해 충남 현장 내 자산 위치를 실시간으로 확인합니다.</p>
            <div id="kakao-map" class="w-full h-[500px] rounded-lg border shadow-inner"></div>
        </div>

        <!-- 3. 엑셀 업로드 탭 -->
        <div id="tab-excel" class="hidden space-y-4">
            <h2 class="text-lg font-bold text-gray-800">엑셀 증분 업로드 및 QR 출력</h2>
            <p class="text-sm text-gray-500">자산 데이터 엑셀 파일을 업로드하고 QR코드를 생성합니다.</p>
            <div class="bg-white p-6 rounded-lg shadow border space-y-3">
                <input type="file" id="excel-file-input" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>
        </div>

    </main>

    <!-- 관리자 로그인 모달 -->
    <div id="login-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-lg w-80 space-y-4">
            <h3 class="text-md font-bold text-gray-800">관리자 인증</h3>
            <input type="password" id="admin-pw" placeholder="관리자 암호를 입력하세요" class="w-full border p-2 rounded text-sm">
            <div class="flex justify-end space-x-2">
                <button onclick="closeLoginModal()" class="px-3 py-1 bg-gray-200 rounded text-sm">취소</button>
                <button onclick="verifyAdmin()" class="px-3 py-1 bg-blue-900 text-white rounded text-sm">확인</button>
            </div>
        </div>
    </div>

    <script>
        let mapInitialized = false;
        let kakaoMapObj = null;

        function switchTab(tab) {
            document.getElementById('tab-dashboard').classList.add('hidden');
            document.getElementById('tab-map').classList.add('hidden');
            document.getElementById('tab-excel').classList.add('hidden');

            document.getElementById('btn-dashboard').className = "text-gray-500 hover:text-blue-600 pb-1";
            document.getElementById('btn-map').className = "text-gray-500 hover:text-blue-600 pb-1";
            document.getElementById('btn-excel').className = "text-gray-500 hover:text-blue-600 pb-1";

            if (tab === 'dashboard') {
                document.getElementById('tab-dashboard').classList.remove('hidden');
                document.getElementById('btn-dashboard').className = "text-blue-600 border-b-2 border-blue-600 pb-1 font-semibold";
            } else if (tab === 'map') {
                document.getElementById('tab-map').classList.remove('hidden');
                document.getElementById('btn-map').className = "text-blue-600 border-b-2 border-blue-600 pb-1 font-semibold";
                
                // 지도 탭이 열릴 때 카카오맵 렌더링 리프레시
                setTimeout(() => {
                    if (!mapInitialized) {
                        const container = document.getElementById('kakao-map');
                        const options = {
                            center: new kakao.maps.LatLng(36.78, 126.55),
                            level: 3
                        };
                        kakaoMapObj = new kakao.maps.Map(container, options);

                        // 마커 추가
                        const markerPosition = new kakao.maps.LatLng(36.78, 126.55);
                        const marker = new kakao.maps.Marker({ position: markerPosition });
                        marker.setMap(kakaoMapObj);
                        mapInitialized = true;
                    } else if (kakaoMapObj) {
                        kakaoMapObj.relayout();
                        kakaoMapObj.setCenter(new kakao.maps.LatLng(36.78, 126.55));
                    }
                }, 200);
            } else if (tab === 'excel') {
                document.getElementById('tab-excel').classList.remove('hidden');
                document.getElementById('btn-excel').className = "text-blue-600 border-b-2 border-blue-600 pb-1 font-semibold";
            }
        }

        function openLoginModal() { document.getElementById('login-modal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); }

        function verifyAdmin() {
            const pw = document.getElementById('admin-pw').value;
            if (pw === "230880") {
                alert("관리자 권한이 활성화되었습니다.");
                document.getElementById('auth-badge').innerText = "모드: 관리자";
                document.getElementById('auth-badge').className = "bg-red-800 text-white text-xs px-2 py-1 rounded";
                document.getElementById('login-toggle-btn').classList.add('hidden');
                closeLoginModal();
            } else {
                alert("암호가 올바르지 않습니다.");
            }
        }
    </script>
</body>
</html>
