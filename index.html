<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#312e81">
<title>Aurora Asset Manager · 충남 현장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!--
  Aurora Asset Manager (개발 단계)
  ─────────────────────────────────
  · 이 파일 하나에 화면과 기능이 모두 들어 있어요.
  · 자산 데이터는 같은 GitHub 저장소의 assets.json 파일에 저장돼요. (앱에서 처음 저장할 때 자동 생성)
  · 코드 구성
      [1] 기본 설정 (CONFIG)      ← 비밀번호, 카카오 키, 저장소 이름 등 바꿀 값은 여기
      [2] 데이터 저장소 (Store)   ← 12월 Firebase 이전 때 이 구역만 바꾸면 됨
      [3] 로그인
      [4] 화면: 현황 / 자산 / 지도 / 라벨
      [5] 자산 상세·등록 패널
      [6] 엑셀 (양식·올리기·내보내기)
      [7] 설정 · 시작
-->
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--line:#e6e9f0;--line2:#d5dae4;--text:#141a2a;--sub:#667085;--muted:#98a2b3;
  --acc:#0a5eb0;--acc-d:#084b8d;--acc-bg:#e8f1fb;
  --ok:#15803d;--ok-bg:#dcfce7;--use:#0369a1;--use-bg:#e0f2fe;--chk:#b45309;--chk-bg:#fef3c7;--off:#667085;--off-bg:#eef0f3;
  --red:#dc2626;--red-bg:#fee2e2;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:-.01em}
.muted{color:var(--muted)}
.sub{color:var(--sub);font-size:13.5px;margin:4px 0 0}
svg.i{flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 로그인 */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#eef2f7}
.gate-card{background:#fff;border-radius:20px;padding:36px 30px 28px;width:100%;max-width:370px;box-shadow:0 12px 40px rgba(16,24,40,.12);border:1px solid var(--line)}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#4338ca,#0e7490);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.gate-card h1{font-size:21px;margin:18px 0 2px;letter-spacing:-.02em}
.gate-card form{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.pw{width:100%;font-size:22px;letter-spacing:.3em;text-align:center;padding:14px;border:1.5px solid var(--line2);border-radius:12px;outline:none}
.pw:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-bg)}
.gate-err{color:var(--red);font-size:13px;min-height:18px;text-align:center}
.remember{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);justify-content:center}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 레이아웃 */
#app{min-height:100vh}
.hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--line);padding:0 24px;height:64px;box-shadow:0 1px 0 rgba(16,24,40,.02)}
.hdr-logo{display:flex;align-items:center;padding-right:16px;border-right:1px solid var(--line);height:34px}
.gs-logo{height:30px;width:auto;display:block}
.hdr-title{display:flex;flex-direction:column;line-height:1.2;margin-right:14px}
.hdr-title b{font-size:15.5px;letter-spacing:-.01em;color:#2b2f36}
.hdr-title small{font-size:12px;color:var(--sub)}
.hdr-nav{display:flex;gap:4px;height:100%}
.hdr-nav .nav-btn{width:auto;border-radius:0;height:100%;padding:0 14px;border-bottom:3px solid transparent;font-size:15px}
.hdr-nav .nav-btn.on{background:none;color:var(--acc);border-bottom-color:var(--acc)}
.hdr-nav .nav-btn .cnt{margin-left:6px;background:var(--acc)}
.hdr .sync{width:auto}
.mobile-only{display:none!important}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px 14px}
.brand{display:flex;gap:11px;align-items:center;padding:2px 8px 24px}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand small{color:var(--sub);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:11px 12px;border-radius:10px;color:#4b5565;font-weight:600;font-size:14.5px;text-align:left}
.nav-btn:hover{background:#f5f6fa}
.nav-btn.on{background:var(--acc-bg);color:var(--acc)}
.nav-btn .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.side-foot .nav-btn{font-size:13.5px;padding:9px 12px}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);padding:9px 12px;border-radius:10px;border:0;background:none;text-align:left;width:100%}
.sync:hover{background:#f5f6fa}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:#22c55e}.dot.local{background:#f59e0b}.dot.err{background:#ef4444}
.dot.saving,.dot.loading{background:#6366f1;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
main{padding:22px 28px 56px;min-width:0;max-width:1400px;width:100%;margin:0 auto}
.topbar,.tabbar{display:none}

/* 공통 요소 */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:25px;margin:0;letter-spacing:-.025em}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-group{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:#fff;padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{background:#f7f8fb}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc-d)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:13px 18px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:none;padding:8px;border-radius:9px;color:var(--sub);display:inline-grid;place-items:center}
.icon-btn:hover{background:#f1f3f7}
.link{border:0;background:none;color:var(--acc);font-weight:600;font-size:13px;padding:0}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px 3px 8px;border-radius:99px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{--c:var(--ok);--cb:var(--ok-bg)}.mid{--c:var(--chk);--cb:var(--chk-bg)}.bad{--c:var(--red);--cb:var(--red-bg)}.use{--c:var(--use);--cb:var(--use-bg)}.off{--c:var(--off);--cb:var(--off-bg)}
.badge.ok,.badge.mid,.badge.bad,.badge.use,.badge.off{color:var(--c);background:var(--cb)}
.due{font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap;display:inline-block}
.due.red{color:var(--red);background:var(--red-bg)}.due.amber{color:var(--chk);background:var(--chk-bg)}.due.gray{color:var(--sub);background:#f1f3f6}
.empty{text-align:center;padding:34px 10px;color:var(--sub)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:0 12px;color:var(--muted);min-width:0}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-bg)}
.search input{border:0;outline:none;padding:10px 0;flex:1;min-width:0;background:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:#fff;padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;color:#4b5565}
.chip.on{background:var(--text);border-color:var(--text);color:#fff}
.sel{border:1px solid var(--line2);border-radius:10px;padding:9px 10px;background:#fff}

/* 현황 */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.stat{cursor:pointer}
.stat.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-bg)}
.stat.alert{--c:var(--red)} .stat.gray{--c:#8a94a6} .stat.teal{--c:#0e8a80}
.audit-card{--c:var(--acc);cursor:default}
.audit-card.on-audit{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-bg)}
.audit-card.due{--c:var(--chk);background:#fffbeb;border-color:#f5d48a}
.audit-card .progress{margin:6px 0 4px}
.card-links{display:flex;gap:12px;align-items:center;margin-top:4px}
.card-link{border:0;background:none;padding:0;font-size:12.5px;font-weight:700;color:var(--acc);cursor:pointer}
.card-link.strong{margin-left:auto;color:#fff;background:var(--acc);border-radius:7px;padding:3px 10px}
.card-link.warn{color:var(--chk);margin-top:6px;display:block}
.card-link.on{text-decoration:underline}
.stat-sub{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.5}
.st-link{border-radius:6px;padding:1px 4px;margin:0 -2px;cursor:pointer}
.st-link:hover,.st-link.on{background:var(--acc-bg);color:var(--acc)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-radius:var(--r);padding:14px 18px;margin-bottom:14px}
.banner.audit-on{background:#fff;border:1.5px solid var(--acc)}
.banner.audit-due{background:var(--chk-bg);color:var(--chk);border:1px solid #f5d48a}
.banner.audit-due b{color:#7c3a06}
.audit-line{font-size:12.5px;color:var(--sub);margin:-4px 0 14px 2px}
.list-head{display:flex;gap:10px;align-items:center;margin:2px 2px 10px;font-size:13px;color:var(--sub);font-weight:600}
.list-head .chip{padding:3px 10px;font-size:12px;cursor:pointer}
.sel-bar{position:sticky;top:72px;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#1b2433;color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:10px;box-shadow:0 6px 20px rgba(16,24,40,.18)}
.sel-bar .btn{background:#2b3648;border-color:#3b475b;color:#fff}.sel-bar .btn:hover{background:#364258}
.sel-bar .muted{color:#9aa6ba;margin-left:6px}.sel-bar .link{color:#9cc4ff}
.vsep{width:1px;height:20px;background:#3b475b;margin:0 4px}
.tbl th.ck,.tbl td.ck{width:38px;padding-right:0}
.tbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);cursor:pointer}
.tbl th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
.tbl th.sortable:hover{color:var(--text)}
.tbl th.sortable.on{color:var(--acc)}
.tbl th .arrow{font-size:10px;margin-left:4px;opacity:.5}
.tbl th.on .arrow{opacity:1}
.tbl tr.picked{background:var(--acc-bg)}
.no-coord{color:#e8a23a;font-size:9px;vertical-align:middle}
.dd{position:relative}
.dd-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.14);padding:6px;min-width:200px;z-index:30}
.dd-menu.open{display:block}
.dd-menu button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;text-align:left}
.dd-menu button:hover{background:#f3f5f9}
.map-box{height:calc(100vh - 360px);min-height:420px}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:35;border:0;border-radius:99px;background:var(--acc);color:#fff;font-weight:800;font-size:15px;padding:14px 20px 14px 16px;box-shadow:0 8px 24px rgba(10,94,176,.4);align-items:center;gap:8px}
.fab svg{width:22px;height:22px}
.scanner{position:fixed;inset:0;z-index:80;background:#000;color:#fff;display:flex;flex-direction:column}
.scan-top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top))}
.scan-view{position:relative;flex:1;min-height:0;overflow:hidden}
.scan-view video{width:100%;height:100%;object-fit:cover}
.scan-frame{position:absolute;left:50%;top:50%;width:62vw;height:62vw;max-width:300px;max-height:300px;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.scan-panel{background:#fff;color:var(--text);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:58vh;overflow:auto}
.scan-msg{font-weight:700;text-align:center;margin-bottom:6px}
.scan-gps{font-size:12.5px;text-align:center;color:var(--sub)}.scan-gps.ok{color:var(--ok)}.scan-gps.warn{color:var(--chk)}
.scan-res{border-radius:12px;padding:12px 14px;margin-bottom:10px}
.scan-res.ok{background:var(--ok-bg)}.scan-res.bad{background:var(--red-bg);color:var(--red)}
.scan-res-top{display:flex;justify-content:space-between;align-items:center}
.scan-name{font-size:17px;font-weight:800;margin:4px 0 2px}
.scan-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.scan-tags span{background:#fff;border-radius:7px;padding:3px 8px;font-size:12px;font-weight:700;color:var(--ok)}
.scan-tags span.warn{color:var(--chk)}
.scan-done{background:var(--acc);color:#fff;border-radius:12px;padding:12px;text-align:center;font-weight:800;margin-bottom:10px}
.shutter-row{display:flex;justify-content:space-between;align-items:center;margin:14px 4px 4px}
.shutter{width:72px;height:72px;border-radius:50%;border:5px solid var(--acc);background:#fff;box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 40px var(--acc-bg)}
.shutter:active{transform:scale(.94)}
.scanner.photo-mode .scan-frame{display:none}
.scan-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scan-btns .btn:only-child{grid-column:1/-1}
.scan-sub-btns{text-align:center;margin-top:10px}
.scan-note{font-size:11.5px;color:var(--sub);text-align:center;margin:8px 0 0}
.scan-prog{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:13px}
.scan-left{font-size:12px;color:var(--sub)}
.asset-photo{position:relative;border-radius:12px;overflow:hidden;margin-bottom:14px;background:#eef1f5;aspect-ratio:4/3}
.asset-photo img{width:100%;height:100%;object-fit:cover;display:block}
.asset-photo span{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;border-radius:6px;padding:2px 7px}
.asset-photo.err img{display:none}.asset-photo.err::after{content:"사진을 불러오는 중이거나 없어요";position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:13px}
.photo-pick{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:10px;border:1px dashed var(--line2);border-radius:10px;padding:10px;font-weight:700;font-size:13.5px;color:var(--acc);cursor:pointer}
.thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;flex:none;background:#eef1f5}
.nm-wrap{display:flex;gap:10px;align-items:center}
.mcard.has-thumb{position:relative;padding-right:72px}
.mcard.has-thumb>.thumb{position:absolute;right:14px;bottom:14px;width:48px;height:48px}
.loc-groups{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:13px}
.loc-groups .chip b{margin-left:3px}
.hist{border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
.hist>div{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-bottom:1px solid #f0f2f6}
.hist>div:last-child{border-bottom:0}
.coord-state{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--sub);background:#f6f7fa;border-radius:10px;padding:10px 12px}
.coord-state.on{background:var(--ok-bg);color:var(--ok);font-weight:600}
.loc-list{border:1px solid var(--line);border-radius:12px;max-height:220px;overflow:auto}
.loc-list>div{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-bottom:1px solid #f0f2f6;font-size:13.5px}
.loc-list>div:last-child{border-bottom:0}
details.adv summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--sub)}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 14px;text-align:left;position:relative;overflow:hidden}
.stat:hover{border-color:var(--line2);box-shadow:0 3px 10px rgba(16,24,40,.06)}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--acc))}
.stat .lbl{font-size:13px;color:var(--sub);font-weight:600}
.stat .num{font-size:32px;font-weight:800;margin-top:4px;letter-spacing:-.03em;color:var(--c,var(--text))}
.stat .num small{font-size:14px;font-weight:600;color:var(--sub);margin-left:3px}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
.count{background:var(--red-bg);color:var(--red);font-size:12px;padding:1px 8px;border-radius:99px}
.row-item{display:flex;align-items:center;gap:12px;padding:11px 10px;margin:0 -10px;border-radius:10px;cursor:pointer}
.row-item:hover{background:#f7f8fb}
.row-item + .row-item{box-shadow:0 -1px 0 #f0f2f6}
.ri-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ri-icon.red{background:var(--red-bg);color:var(--red)}.ri-icon.amber{background:var(--chk-bg);color:var(--chk)}
.ri-main{flex:1;min-width:0}
.ri-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-sub{font-size:12.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 자산 목록 */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar .search{flex:1 1 240px;max-width:340px}
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12.5px;color:var(--sub);font-weight:600;padding:11px 14px;background:#fafbfc;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 14px;border-bottom:1px solid #f0f2f6;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#f8f9fc}
.tbl .nm{font-weight:600}
.tbl .chev{color:var(--muted);width:30px}
.mlist{display:none}
.mcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:10px;cursor:pointer}
.mc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mc-name{font-size:16px;font-weight:700;margin:6px 0 3px;letter-spacing:-.01em}
.mc-sub{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:4px}
.mc-due{margin-top:9px}

/* 패널 (상세·등록) */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.38);display:flex;justify-content:flex-end}
.panel{background:#fff;width:460px;max-width:100%;height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.12);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.p-head h2{font-size:20px;margin:3px 0 0;letter-spacing:-.02em;line-height:1.3}
.p-body{flex:1;overflow:auto;padding:18px 20px 24px}
.p-foot{display:flex;gap:8px;padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.p-foot .btn{flex:1}
.flabel{font-size:13px;font-weight:700;color:#344054;margin:0 0 7px;display:flex;gap:4px;align-items:center}
.flabel em{color:var(--red);font-style:normal}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-bottom:20px}
.seg.two{grid-auto-flow:row;grid-template-columns:1fr 1fr}
.seg button small{display:block;font-weight:500;font-size:11px;opacity:.8;margin-top:2px}
.out-banner{background:#f1f3f6;border-radius:12px;padding:14px;margin-bottom:16px}
.out-banner b{font-size:15px}
.out-banner .ri-sub{white-space:normal;margin-top:4px}
.full-model{font-size:13px;color:var(--sub);white-space:normal;line-height:1.5}
.qty{font-weight:700;white-space:nowrap}
.sum-line{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;margin-bottom:18px;font-size:13.5px;color:var(--sub)}
.sum-line b{color:var(--text)}
.audit{margin-bottom:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.audit .ri-main{min-width:220px}
.progress{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.progress i{display:block;height:100%;background:var(--acc);border-radius:99px}
.audit-banner{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--acc-bg);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13.5px;color:var(--acc);font-weight:600}
.audit-banner.done{background:var(--ok-bg);color:var(--ok)}
.seg button{border:1.5px solid var(--line2);background:#fff;border-radius:10px;padding:11px 4px;font-weight:700;font-size:13.5px;color:#4b5565}
.seg button.on{border-color:var(--c);background:var(--cb);color:var(--c)}
.info{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.info>div{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid #f0f2f6;align-items:baseline}
.info>div:last-child{border-bottom:0}
.info dt{width:78px;flex:none;color:var(--sub);font-size:13px}
.info dd{margin:0;flex:1;min-width:0;font-weight:500;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.qr-box{display:flex;gap:16px;align-items:center;margin-top:16px;padding:14px;border:1px dashed var(--line2);border-radius:12px}
.qr-box img{width:92px;height:92px;flex:none;image-rendering:pixelated}
.field{margin-bottom:18px}
.inp{width:100%;border:1px solid var(--line2);border-radius:10px;padding:11px 12px;outline:none;background:#fff;font-size:15px}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-bg)}
textarea.inp{min-height:70px;resize:vertical}
.cat-chips{display:flex;flex-wrap:wrap;gap:6px}
.cat-chips .chip{padding:9px 14px;font-size:14px}
.cat-chips .chip.on{background:var(--acc);border-color:var(--acc)}
.coord-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.coord-btns{display:flex;gap:8px;margin-top:8px}
.coord-btns .btn{flex:1}
details.more{border-top:1px solid var(--line);padding-top:14px}
details.more summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--sub);margin-bottom:14px;list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸";transition:.15s}
details[open].more summary::before{transform:rotate(90deg)}
.ferr{color:var(--red);font-size:13px;font-weight:600;margin-top:-6px;margin-bottom:12px}

/* 모달 */
.modal-wrap{position:fixed;inset:0;z-index:60;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:860px}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 12px}
.m-head h2{margin:0;font-size:18px}
.m-body{padding:0 20px 16px;overflow:auto}
.m-foot{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);align-items:center}
.sp{flex:1}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.set-grid label,.set-one{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:#344054}
.set-one{margin-top:10px}
.hint{font-size:12.5px;color:var(--sub);margin:6px 0 0;line-height:1.55}
.set-block{padding:14px 0;border-top:1px solid var(--line)}
.set-block:first-child{border-top:0;padding-top:4px}
.set-block h3{margin:0 0 2px;font-size:14.5px}
.test-res{font-size:13px;font-weight:600;margin-top:8px}
.sum-chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.sum-chips span{font-size:13px;font-weight:700;padding:5px 11px;border-radius:99px}
.t-new{background:var(--ok-bg);color:var(--ok)}.t-update{background:var(--use-bg);color:var(--use)}.t-error{background:var(--red-bg);color:var(--red)}.t-same{background:#f1f3f6;color:var(--sub)}
.plan{width:100%;border-collapse:collapse;font-size:13px}
.plan th{text-align:left;color:var(--sub);font-weight:600;padding:8px;border-bottom:1px solid var(--line);background:#fafbfc;position:sticky;top:0}
.plan td{padding:9px 8px;border-bottom:1px solid #f0f2f6;vertical-align:top}
.plan .tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.chg{color:var(--sub)} .chg b{color:var(--use)}
.pmap{width:100%;height:56vh;min-height:300px;border-radius:12px;background:#e9edf3;overflow:hidden}
.pick-coord{margin-top:10px;font-size:13.5px;color:var(--sub)}
.guide{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:14.5px;line-height:1.55}
.guide b{color:var(--acc)}

/* 지도 */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:50%;background:var(--c);display:inline-block}
.map-layout{display:grid;grid-template-columns:300px 1fr;gap:14px;height:calc(100vh - 150px);min-height:460px}
.map-list{background:#fff;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.map-list .search{margin:12px}
.map-items{overflow:auto;flex:1;padding:0 6px 8px}
.mi{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.mi:hover,.mi.on{background:var(--acc-bg)}
.mi i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.map-box{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#e9edf3;position:relative}
#kmap{width:100%;height:100%}
.map-fail{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--sub);gap:6px}
.map-fail b{color:var(--text);font-size:15px}
.pin{width:20px;height:20px;border-radius:50%;border:3px solid #fff;background:var(--c);box-shadow:0 1px 5px rgba(0,0,0,.4);padding:0;display:block}
.pin.big{width:26px;height:26px}
.mapcard{background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.2);padding:12px 14px;min-width:210px;max-width:260px;font-size:13px;position:relative}
.mapcard::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.mapcard b{display:block;font-size:14px;margin:4px 0 2px;white-space:normal}
.mapcard .btn{margin-top:10px;width:100%}

/* 라벨 */
.lab-layout{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.lab-pick{padding:14px;position:sticky;top:20px}
.lab-row{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 6px;font-size:13px;color:var(--sub)}
.lab-row div{display:flex;gap:12px}
.lab-items{max-height:calc(100vh - 260px);overflow:auto;margin:0 -6px}
.lab-it{display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:9px;cursor:pointer}
.lab-it:hover{background:#f7f8fb}
.lab-it input{width:17px;height:17px;accent-color:var(--acc);flex:none}
.lab-preview{min-width:0}
.sheet-scale{transform-origin:top left}
.sheet-gap{height:16px}
.prev-note{font-size:12.5px;color:var(--sub);margin:0 0 10px}
.lab-sheets{background:#eef1f5;border-radius:12px;padding:14px;max-height:62vh;overflow:auto}

/* 라벨 실물 크기 (인쇄·미리보기 공통) */
.sheet{background:#fff;display:grid;grid-auto-rows:70mm;align-content:center;justify-content:center;box-shadow:0 2px 14px rgba(16,24,40,.12);overflow:hidden}
.paper-seg{display:inline-grid;grid-template-columns:1fr 1fr;background:#eef0f3;border-radius:11px;padding:3px;gap:3px}
.paper-seg button{border:0;background:none;border-radius:8px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--sub);display:inline-flex;align-items:center;gap:5px}
.paper-seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.paper-seg small{font-weight:500;margin-left:4px}
.dues{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.label{width:70mm;height:70mm;border:.3mm dashed #9aa3b2;display:flex;flex-direction:column;align-items:center;padding:3.5mm 4mm 3mm;color:#111;font-family:inherit}
.lb-top{width:100%;display:flex;justify-content:space-between;font-size:7.5pt;font-weight:700;color:#4338ca;letter-spacing:.04em}
.lb-top span:last-child{color:#555;letter-spacing:0}
.lb-qr{width:40mm;height:40mm;margin-top:1.8mm;image-rendering:pixelated}
.lb-qr.none{display:grid;place-items:center;border:1px solid #ccc;font-size:8pt;color:#999}
.lb-id{font-size:16pt;font-weight:800;letter-spacing:.02em;margin-top:1.6mm;line-height:1}
.lb-name{font-size:8pt;font-weight:600;text-align:center;line-height:1.25;margin-top:1.3mm;max-height:2.5em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;width:100%}
#print-area{display:none}

/* 토스트 */
#toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#111827;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s ease-out;max-width:90vw}
.toast.err{background:#b91c1c}.toast.warn{background:#92400e}
@keyframes tin{from{transform:translateY(10px);opacity:0}}

/* 휴대폰 */
@media (max-width:899px){
  .hdr{padding:0 10px 0 14px;height:56px;gap:8px;padding-top:env(safe-area-inset-top);height:calc(56px + env(safe-area-inset-top))}
  .hdr-logo{border-right:0;padding-right:4px}
  .gs-logo{height:24px}
  .hdr-title small,.hdr-nav,.sync-text{display:none}
  .hdr-title b{font-size:14px}
  .hdr .sync{padding:6px 8px}
  main{padding:14px 12px 40px}
  h1{font-size:22px}
  .page-head{align-items:center;margin-bottom:14px}
  .desktop-only{display:none!important}
  .mobile-only{display:inline-flex!important}
  .stats{display:flex;overflow-x:auto;gap:8px;margin:0 -12px 12px;padding:0 12px 4px;scroll-snap-type:x mandatory}
  .stat{flex:0 0 46%;scroll-snap-align:start;padding:12px 14px}
  .stat .num{font-size:26px}
  .banner{padding:12px 14px}
  .banner .ri-main{flex-basis:100%;min-width:0}
  .banner .btn{flex:1}
  .hdr-title{min-width:0;margin-right:0}
  .hdr-title b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
  .toolbar>.btn.primary{flex:1}
  .toolbar{gap:8px}
  .toolbar .search{max-width:none;flex-basis:100%}
  .toolbar .sel{flex:1 1 40%;min-width:0}
  .toolbar .sp{display:none}
  .tbl-wrap{display:none}
  .mlist{display:block}
  .panel{width:100%}
  .map-box{height:calc(100vh - 330px);min-height:360px}
  .modal-wrap{padding:0;align-items:flex-end}
  .modal{border-radius:18px 18px 0 0;max-height:94vh}
  .set-grid{grid-template-columns:1fr}
  #toasts{bottom:24px}
}
@media print{
  body{background:#fff}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  .sheet{box-shadow:none;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<!-- 로그인 화면 -->
<div id="gate" class="hidden">
  <div class="gate-card">
    <img class="gs-logo" data-logo alt="GS건설" style="height:34px">
    <h1>Aurora Asset Manager</h1>
    <p class="sub">충남 현장 v2.4 · 관리자 전용</p>
    <form onsubmit="login(event)">
      <input id="pw" class="pw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호" aria-label="관리자 비밀번호">
      <div id="gate-err" class="gate-err"></div>
      <button class="btn primary lg" type="submit">들어가기</button>
      <label class="remember"><input type="checkbox" id="remember" checked> 이 기기에서 30일 동안 로그인 유지</label>
    </form>
  </div>
</div>

<!-- 앱: 위쪽 가로 헤더 (GS건설 로고를 누르면 첫 화면) -->
<div id="app" class="hidden">
  <header class="hdr">
    <a class="hdr-logo" href="#assets" onclick="goHome();return false" title="첫 화면으로"><img class="gs-logo" data-logo alt="GS건설"></a>
    <div class="hdr-title"><b>Aurora Asset Manager</b><small>충남 현장 v2.4</small></div>
    <span class="sp"></span>
    <button class="sync" onclick="reloadData()" title="눌러서 새로고침"><span class="dot" data-sync-dot></span><span data-sync-text class="sync-text">불러오는 중…</span></button>
    <button class="icon-btn" onclick="openSettings()" aria-label="설정" title="설정"><span data-ic="settings"></span></button>
    <button class="icon-btn" onclick="logout()" aria-label="로그아웃" title="로그아웃"><span data-ic="logout"></span></button>
  </header>
  <main id="view"></main>
  <button class="fab mobile-only" onclick="openScanner()" aria-label="QR 스캔"><span data-ic="qr"></span><span>QR 스캔</span></button>
</div>

<!-- QR 스캐너 (휴대폰) -->
<div id="scanner" class="scanner hidden">
  <div class="scan-top"><b>QR 스캔</b><button class="icon-btn" onclick="closeScanner()" aria-label="닫기" style="color:#fff"><span data-ic="x"></span></button></div>
  <div class="scan-view"><video id="scan-video" playsinline muted></video><div class="scan-frame"></div><canvas id="scan-canvas" hidden></canvas></div>
  <div class="scan-panel" id="scan-panel"></div>
</div>

<div id="drawer" class="overlay hidden" onclick="if(event.target===this)closeDrawer()"><div class="panel" id="panel"></div></div>
<div id="modal" class="modal-wrap hidden" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal-box"></div></div>
<div id="toasts"></div>
<div id="print-area"></div>
<input type="file" id="xl-file" accept=".xlsx,.xls" hidden onchange="handleExcel(this)">

/* ── 할 일: 상태 '하' + 점검일 7일 이내 + 렌탈 반납 14일 이내 ── */
function todos() {
  const out = []; const miss = missingIds();
  activeAssets().forEach(a => {
    const tags = [];
    if (a.status === '하') tags.push({ level: 'red', text: '상태 하', rank: -1000 });
    const c = dday(a.nextCheck);
    if (c !== null && c <= 7) tags.push({ level: c < 0 ? 'red' : 'amber', text: '점검 ' + ddText(c), rank: c });
    const r = dday(a.rentalDue);
    if (r !== null && r <= 14) tags.push({ level: r < 0 ? 'red' : 'amber', text: '렌탈 반납 ' + ddText(r), rank: r });
    if (miss.has(a.id)) tags.push({ level: 'red', text: '실사 미발견', rank: -900 });
    if (tags.length) out.push({ a, tags: tags.sort((x, y) => x.rank - y.rank) });
  });
  return out;
}

const FILTER_KO = { all: '', todo: '할 일', out: '현장 종료', disposed: '폐기', nocoord: '좌표 미등록', unaudited: '실사 미확인', 'st:상': '상태 상', 'st:중': '상태 중', 'st:하': '상태 하' };

/* ── 정기 실사: 진행 중 띠 / 60일 알림 ── */
const AUDIT_DAYS = 60;

/* 정기 실사 카드: 진행 중 / 시기 됨 / 다음 예정 + 좌표 미등록 한 줄(0건이면 사라짐) */

/* ── 지도 (자산 화면의 [지도] 전환: 걸러진 자산만 표시) ── */
let KAKAO_P = null, MAP = null, MAP_INFO = null, MAP_FOCUS = null;
function loadKakao() {
  if (window.kakao && kakao.maps && kakao.maps.LatLng) return Promise.resolve();
  if (KAKAO_P) return KAKAO_P;
  KAKAO_P = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey=' + CONFIG.KAKAO_KEY;
    const to = setTimeout(() => rej(new Error('timeout')), 10000);
    s.onload = () => { try { kakao.maps.load(() => { clearTimeout(to); res(); }); } catch (e) { clearTimeout(to); rej(e); } };
    s.onerror = () => { clearTimeout(to); rej(new Error('load')); };
    document.head.appendChild(s);
  });
  KAKAO_P.catch(() => { KAKAO_P = null; });
  return KAKAO_P;
}
const mapFail = () => `<div class="map-fail">${icon('map', 30)}<b>지도를 불러오지 못했어요</b>인터넷 연결을 확인하거나, 카카오 개발자 콘솔에<br>이 사이트 주소(도메인)가 등록되어 있는지 확인해 주세요.</div>`;
async function initMainMap() {
  updateSelBar();
  const all = filteredAssets(), list = all.filter(hasCoord);
  const cntEl = $('asset-count'); if (cntEl) cntEl.textContent = `${all.length}건 중 지도 표시 ${list.length}건${all.length > list.length ? ` · 좌표 없음 ${all.length - list.length}건` : ''}`;
  const box = $('asset-list'); if (!box) return;
  box.innerHTML = `<div class="legend" style="margin-bottom:8px">${STATUSES.map(s => `<span class="${ST_KEY[s]}"><i></i>상태 ${s}</span>`).join('')}</div><div class="map-box"><div id="kmap"></div></div>`;
  const el = $('kmap');
  if (!list.length) { el.parentElement.insertAdjacentHTML('beforeend', `<div class="map-fail">${icon('pin', 30)}<b>지도에 표시할 자산이 없어요</b>좌표가 등록된 자산만 지도에 나와요.<br>휴대폰으로 QR을 찍고 '지금 위치로 넣기'를 눌러 주세요.</div>`); }
  try { await loadKakao(); } catch (e) { el.parentElement.insertAdjacentHTML('beforeend', mapFail()); return; }
  if (!document.body.contains(el)) return;
  MAP = new kakao.maps.Map(el, { center: new kakao.maps.LatLng(...CONFIG.MAP_CENTER), level: 4 });
  MAP.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  MAP_INFO = null;
  const bounds = new kakao.maps.LatLngBounds();
  list.forEach(a => {
    const pin = document.createElement('button');
    pin.className = 'pin ' + (a.out ? 'off' : ST_KEY[a.status]); pin.title = dispName(a); pin.setAttribute('aria-label', dispName(a));
    pin.addEventListener('click', ev => { ev.stopPropagation(); mapSelect(a.id); });
    const pos = new kakao.maps.LatLng(a.lat, a.lng);
    new kakao.maps.CustomOverlay({ position: pos, content: pin, xAnchor: .5, yAnchor: .5, zIndex: 2 }).setMap(MAP);
    bounds.extend(pos);
  });
  kakao.maps.event.addListener(MAP, 'click', closeMapInfo);
  setTimeout(() => {
    if (!MAP) return; MAP.relayout();
    if (MAP_FOCUS) { const f = MAP_FOCUS; MAP_FOCUS = null; mapSelect(f, 3); }
    else if (list.length > 1) MAP.setBounds(bounds, 60, 60, 60, 60);
    else if (list.length === 1) MAP.setCenter(new kakao.maps.LatLng(list[0].lat, list[0].lng));
  }, 80);
}
function closeMapInfo() { if (MAP_INFO) { MAP_INFO.setMap(null); MAP_INFO = null; } }
function mapSelect(id, level) {

const QR_CACHE = {};

/* 위치 권한: 휴대폰 보안 기능이라 앱이 대신 허용할 수는 없음.

/* ═══════════════════════════════════════════
   [5-2] QR 스캔 (휴대폰) · 위치 자동 저장 · 사진
   · 연속 스캔: 찍을 때마다 진동 + 결과 표시 → [사진 찍기] / [다음 스캔]
   · 위치: 스캔하는 순간의 GPS를 저장. 오차가 50m보다 크면 이미 있는 좌표는 덮어쓰지 않음
   · 실사 중이면 자동 확인, 모두 확인되면 실사 자동 완료
   · 사진: 자산마다 최신 1장 → GitHub photos/관리번호.jpg (공개 저장소!)
   ═══════════════════════════════════════════ */
const GPS_MAX_ACC = 50;            // m: 이보다 오차가 크면 기존 좌표를 덮어쓰지 않음
const GPS_SAME = 10;               // m: 이보다 가까우면 위치가 그대로라고 보고 저장 안 함
let SCAN = null;                   // {stream, timer, watch, pos, last, busy, detector}
const PHOTO_LOCAL = {};            // 방금 찍은 사진 (화면에 바로 보여주기용)

function distM(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));

}

  return /^[A-Z0-9][A-Z0-9_-]{1,30}$/i.test(t) ? t.toUpperCase() : '';
}

async function openScanner() {

/* 스캔 결과 처리: 실사 확인 · 미발견 해제 · 위치 저장을 한 번에 저장 */
async function onScan(id) {

  scanUI('saving', { a });
  const fresh = SCAN.pos && Date.now() - SCAN.pos.at < 30000 ? SCAN.pos : null;
  const r = await recordCheck(id, fresh, 'QR');
  if (!SCAN) return;
  if (!fresh && !a.out) { r.loc = 'wait'; SCAN.pendingLoc = id; }   // 위치를 아직 못 잡았으면, 잡히는 대로 저장

  const id = SCAN.pendingLoc; SCAN.pendingLoc = null; SCAN.savingLoc = true;
  const r = await recordCheck(id, SCAN.pos, 'QR');
  if (!SCAN) return; SCAN.savingLoc = false;
  if (SCAN.lastRes && SCAN.lastRes.id === id) { SCAN.lastRes.r.loc = r.loc; SCAN.lastRes.r.acc = r.acc; if (!SCAN.photoMode) scanUI('result', { a: getAsset(id), r: SCAN.lastRes.r }); }
}
async function recordCheck(id, pos, how) {
  // 다른 기기에서 바뀐 내용(실사 시작 등)을 놓치지 않게 최신 데이터를 먼저 읽어요
  if (Store.mode() === 'github') { try { DOC = await Store.load(); } catch (e) {} }
  const a = getAsset(id); if (!a) return {};

    if (!hasCoord(a)) loc = pos.acc <= 500 ? 'new' : 'bad';
    else if (pos.acc > GPS_MAX_ACC) loc = 'keep';
    else loc = distM({ lat: +a.lat, lng: +a.lng }, pos) < GPS_SAME ? 'same' : 'move';
  }
  const r = { audit: false, done: false, found: false, loc, acc: pos ? Math.round(pos.acc) : null };
  if (!needAudit && !needFound && loc !== 'new' && loc !== 'move') return r;
  const res = await saveChange(doc => {
    const now = new Date().toISOString(); const x = doc.assets.find(y => y.id === id); if (!x) return r;
    if (doc.audit && !x.out && !doc.audit.checked[id]) {
      doc.audit.checked[id] = now; addLog(x, `실사 확인 (${how})`, now); r.audit = true;
      if (doc.assets.filter(y => !y.out).every(y => doc.audit.checked[y.id])) { closeAuditDoc(doc, now); r.done = true; }
    }
    const lm = doc.auditLog[0];
    if (lm && lm.missing.includes(id)) { lm.missing = lm.missing.filter(z => z !== id); addLog(x, '실사 미발견 → 찾음', now); r.found = true; }
    if (loc === 'new' || loc === 'move') { x.lat = +pos.lat.toFixed(6); x.lng = +pos.lng.toFixed(6); addLog(x, `${loc === 'new' ? '좌표 입력' : '위치 갱신'} (${how}, 오차 약 ${r.acc}m)`, now); }
    x.updatedAt = now; return r;
  }, `${how === 'QR' ? 'QR 스캔' : '직접 확인'}: ${id}${needAudit ? ' · 실사 확인' : ''}${loc === 'new' || loc === 'move' ? ' · 위치' : ''}`, null);
  if (res && res.done) toast('🎉 모든 자산을 확인해서 실사가 완료됐어요');
  return res || r;
}

/* 사진: 지금 카메라 화면을 그대로 찍어 저장 (최신 1장만 유지) */
function photoMode() {   // QR을 찍은 화면 그대로가 아니라, 장비 전체를 다시 맞춘 뒤 찍게 함
  if (!SCAN || !SCAN.photoFor) return;
  if (Store.mode() !== 'github') return toast('사진은 GitHub 연결(설정의 토큰) 후에 저장돼요', 'warn');
  SCAN.photoMode = true; $('scanner').classList.add('photo-mode'); scanUI('photo');
}
function cancelPhoto() { if (!SCAN) return; SCAN.photoMode = false; $('scanner').classList.remove('photo-mode'); scanUI('result', { a: getAsset(SCAN.lastRes.id), r: SCAN.lastRes.r }); }
async function takePhoto() {
  if (!SCAN || !SCAN.photoFor) return;
  const id = SCAN.photoFor, v = $('scan-video');
  const btn = $('shutter'); if (btn) btn.disabled = true;
  if (navigator.vibrate) navigator.vibrate(40);
  const { full, thumb } = snapImages(v);
  PHOTO_LOCAL[id] = full;
  $('scan-panel').innerHTML = `<div class="scan-msg">사진 저장하는 중…</div>`;
  const ok = await savePhoto(id, full, thumb);
  if (!SCAN) return;
  SCAN.photoMode = false; $('scanner').classList.remove('photo-mode');
  if (ok) scanUI('photo-done', { id, src: full }); else scanUI('photo');
}
function snapImages(src) {
  const w0 = src.videoWidth || src.naturalWidth, h0 = src.videoHeight || src.naturalHeight;
  const k = Math.min(1, 1280 / Math.max(w0, h0)); const c = document.createElement('canvas');
  c.width = Math.round(w0 * k); c.height = Math.round(h0 * k); c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  const full = c.toDataURL('image/jpeg', 0.72);
  const t = document.createElement('canvas'), s = Math.min(w0, h0); t.width = t.height = 64;
  t.getContext('2d').drawImage(src, (w0 - s) / 2, (h0 - s) / 2, s, s, 0, 0, 64, 64);
  return { full, thumb: t.toDataURL('image/jpeg', 0.6) };
}
async function savePhoto(id, full, thumb) {
  try {
    await Store.putFile(`photos/${id}.jpg`, full.split(',')[1], `사진 갱신: ${id}`);
  } catch (e) { toast('사진을 올리지 못했어요 · ' + e.message, 'err'); return false; }
  const res = await saveChange(doc => { const x = doc.assets.find(y => y.id === id); if (x) { const now = new Date().toISOString(); x.photoAt = now; x.thumb = thumb; addLog(x, '사진 갱신', now); x.updatedAt = now; } return true; },
    `사진 정보: ${id}`, '사진을 저장했어요');
  return !!res;
}
function photoUrl(a) {
  if (PHOTO_LOCAL[a.id]) return PHOTO_LOCAL[a.id];
  if (!a.photoAt) return '';
  const c = Store.cfg();
  return `https://raw.githubusercontent.com/${c.owner}/${c.repo}/${c.branch}/photos/${encodeURIComponent(a.id)}.jpg?v=${Date.parse(a.photoAt) || 0}`;
}
/* 상세 화면에서 사진 바꾸기 (휴대폰 카메라 또는 사진첩) */
async function pickPhoto(id, input) {
  const f = input.files[0]; input.value = ''; if (!f) return;
  if (Store.mode() !== 'github') return toast('사진은 GitHub 연결(설정의 토큰) 후에 저장돼요', 'warn');
  const img = new Image(); img.src = URL.createObjectURL(f);
  try { await img.decode(); } catch (e) { return toast('사진을 읽지 못했어요', 'err'); }
  const { full, thumb } = snapImages(img); URL.revokeObjectURL(img.src);
  PHOTO_LOCAL[id] = full; toast('사진 올리는 중…');
  if (await savePhoto(id, full, thumb)) renderDrawer();
}

async function qrOpened(id) {

    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }), () => res(null), { enableHighAccuracy: true, timeout: 12000, maximumAge: 10000 });
  });
  const r = await recordCheck(id, pos, 'QR');
  const msg = [r.audit && '실사 확인 ✓', r.found && '미발견 → 찾음', r.loc === 'new' && '좌표 저장', r.loc === 'move' && '위치 갱신'].filter(Boolean);
  if (msg.length && !r.done) toast(msg.join(' · '));
  if (DRAWER && DRAWER.id === id) renderDrawer();
}

  if (!it) return toast('품목 이름을 넣어 주세요', 'warn');
  if (catOf(it)) return toast(`'${it}'은(는) 이미 '${catOf(it)}'에 있어요`, 'warn');
  const res = await saveChange(doc => { doc.catalog[it] = k; return true; }, `품목 추가: ${it} (${k})`, `'${it}' 품목을 추가했어요`);
  if (res) openSettings();
}
function saveSettings() {
  const c = readSettingsForm(); const before = Store.mode();
  Store.saveCfg(c); Object.keys(QR_CACHE).forEach(k => delete QR_CACHE[k]);
  closeModal(); toast('설정을 저장했어요');
  if (before === 'local' && c.token && lsGet('aam_local')) toast('이 기기에서 만든 데이터는 다음 저장 때 GitHub에 올라가요 (GitHub에 데이터가 없을 때만)', 'warn');
  reloadData();
}
function startApp() {
  $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
  document.querySelectorAll('[data-ic]').forEach(el => el.outerHTML = icon(el.dataset.ic));
  DOC = normalizeDoc((Store.mode() === 'local' ? lsGet('aam_local') : null) || lsGet('aam_cache') || seedDoc());
  render(); reloadData();
}
window.addEventListener('hashchange', () => { render(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('modal').classList.contains('hidden')) closeModal(); else closeDrawer(); } });
let RESIZE_T; window.addEventListener('resize', () => { clearTimeout(RESIZE_T); RESIZE_T = setTimeout(() => { if ($('lab-sheets')) renderPrint(); if (MAP) MAP.relayout(); }, 150); });

(function init() {
  const p = new URLSearchParams(location.search);
  if (p.get('id')) { PENDING_ID = p.get('id').toUpperCase(); history.replaceState(null, '', location.pathname + '#assets'); }
  if (isAuthed()) startApp(); else { $('gate').classList.remove('hidden'); setTimeout(() => $('pw').focus(), 50); }
})();
</script>
