<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Asset Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Excel Export/Import) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Kakao Maps API (발급받은 JavaScript 키 적용) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=77c97bf1b0283e37f4ca3c548d45e5e6"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Aurora Asset Manager (충남 현장)</h1>
            <div id="auth-status" class="text-sm">
                <span id="user-role-display" class="bg-blue-800 px-2 py-1 rounded">모드: 일반 사용자</span>
                <button onclick="toggleLoginModal()" id="login-btn" class="ml-2 bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded text-xs">관리자 로그인</button>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 md:grid-cols-4 gap-6">

        <!-- 사이드바 네비게이션 -->
        <aside class="bg-white p-4 rounded-lg shadow-md md:col-span-1 h-fit space-y-2">
            <button onclick="switchTab('dashboard')" class="w-full text-left px-4 py-2 rounded bg-blue-50 text-blue-900 font-semibold hover:bg-blue-100 transition">📊 대시보드 & 자산 현황</button>
            <button onclick="switchTab('map')" class="w-full text-left px-4 py-2 rounded hover:bg-gray-100 transition">🗺️ 현장 지도 (Kakao)</button>
        </aside>

        <!-- 콘텐츠 영역 -->
        <section class="bg-white p-6 rounded-lg shadow-md md:col-span-3">

            <!-- 1. 대시보드 탭 -->
            <div id="tab-dashboard" class="space-y-4">
                <h2 class="text-lg font-bold text-gray-800">자산 목록 및 관리</h2>
                <div class="flex justify-between items-center">
                    <p class="text-sm text-gray-500">충남 오로라 프로젝트 현장 자산 관리 대장입니다.</p>
                    <div id="admin-actions" class="hidden space-x-2">
                        <button onclick="alert('엑셀 다운로드 기능 연동됨')" class="bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-500">엑셀 내보내기</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse border border-gray-200 text-sm">
                        <thead>
                            <tr class="bg-gray-50">
                                <th class="border border-gray-200 p-2">자산 번호</th>
                                <th class="border border-gray-200 p-2">품명 및 규격</th>
                                <th class="border border-gray-200 p-2">위치</th>
                                <th class="border border-gray-200 p-2">상태</th>
                            </tr>
                        </thead>
                        <tbody id="asset-table-body">
                            <tr>
                                <td class="border border-gray-200 p-2">AUR-001</td>
                                <td class="border border-gray-200 p-2">배관 자재 (STS 304)</td>
                                <td class="border border-gray-200 p-2">OSBL 야적장</td>
                                <td class="border border-gray-200 p-2 text-green-600 font-semibold">정상</td>
                            </tr>
                            <tr>
                                <td class="border border-gray-200 p-2">AUR-002</td>
                                <td class="border border-gray-200 p-2">용접기 (Inverter)</td>
                                <td class="border border-gray-200 p-2">ISBL 메인동</td>
                                <td class="border border-gray-200 p-2 text-blue-600 font-semibold">사용중</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 2. 지도 탭 (Kakao Maps) -->
            <div id="tab-map" class="hidden space-y-4">
                <h2 class="text-lg font-bold text-gray-800">현장 위치 지도</h2>
                <p class="text-sm text-gray-500">카카오 지도를 통해 현장 내 주요 자산 및 구역 위치를 확인합니다.</p>
                <!-- 지도가 그려질 영역 -->
                <div id="kakao-map" class="w-full h-[450px] rounded-lg border border-gray-300"></div>
            </div>

        </section>
    </main>

    <!-- 관리자 로그인 모달 -->
    <div id="login-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg shadow-lg w-80 space-y-4">
            <h3 class="text-md font-bold text-gray-800">관리자 암호 입력</h3>
            <input type="password" id="admin-pw-input" placeholder="암호를 입력하세요" class="w-full border border-gray-300 p-2 rounded text-sm">
            <div class="flex justify-end space-x-2">
                <button onclick="toggleLoginModal()" class="px-3 py-1 bg-gray-300 rounded text-sm">취소</button>
                <button onclick="checkAdminLogin()" class="px-3 py-1 bg-blue-900 text-white rounded text-sm">확인</button>
            </div>
        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        let isAdmin = false;
        const ADMIN_PASSWORD = "230880";

        // 탭 전환 기능
        function switchTab(tabName) {
            document.getElementById('tab-dashboard').classList.add('hidden');
            document.getElementById('tab-map').classList.add('hidden');

            if (tabName === 'dashboard') {
                document.getElementById('tab-dashboard').classList.remove('hidden');
            } else if (tabName === 'map') {
                document.getElementById('tab-map').classList.remove('hidden');
                // 지도가 탭 전환 후 정상적으로 그려지도록 레이아웃 재조정 트리거
                setTimeout(() => {
                    if (window.kakaoMap) {
                        window.kakaoMap.relayout();
                        // 충남 현장 부근 기본 좌표 설정
                        let moveLatLon = new kakao.maps.LatLng(36.78, 126.55);
                        window.kakaoMap.setCenter(moveLatLon);
                    }
                }, 200);
            }
        }

        // 로그인 모달 토글
        function toggleLoginModal() {
            const modal = document.getElementById('login-modal');
            modal.classList.toggle('hidden');
        }

        // 관리자 로그인 검증
        function checkAdminLogin() {
            const inputVal = document.getElementById('admin-pw-input').value;
            if (inputVal === ADMIN_PASSWORD) {
                isAdmin = true;
                alert("관리자 권한이 활성화되었습니다.");
                document.getElementById('user-role-displayinnerText', '모드: 관리자');
                document.getElementById('user-role-display').className = "bg-red-800 px-2 py-1 rounded text-white";
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('admin-actions').classList.remove('hidden');
                toggleLoginModal();
            } else {
                alert("암호가 일치하지 않습니다.");
            }
        }

        // 카카오 지도 초기화
        window.onload = function() {
            const container = document.getElementById('kakao-map');
            const options = {
                center: new kakao.maps.LatLng(36.78, 126.55), // 충남 현장 부근 기본 위경도
                level: 3
            };
            window.kakaoMap = new kakao.maps.Map(container, options);

            // 마커 추가 예시
            const markerPosition = new kakao.maps.LatLng(36.78, 126.55);
            const marker = new kakao.maps.Marker({
                position: markerPosition
            });
            marker.setMap(window.kakaoMap);
        };
    </script>
</body>
</html>
